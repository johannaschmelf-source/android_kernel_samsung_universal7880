name: Build A5 Ultra Kernel
on:
  workflow_dispatch:
  push: {branches: [claude/upbeat-brahmagupta-u4v5tf], paths: [.github/workflows/kernel.yml, scripts/a5ultra/**, arch/arm64/configs/**, arch/arm64/boot/dts/**, drivers/soc/samsung/**]}
permissions:
  contents: write
concurrency:
  group: a5ultra-kernel
  cancel-in-progress: true
env:
  TAG: a5-ultra-v26
jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # wie v24-therm + RAM 1716 @ +100 mV
          - name: v26-ram100
            env: "CPU_UV_DELTA=0 GPU_TOP_EXTRA_UV=50000 THERMAL_SHIFT=20 MIF_KHZ=1716000 MIF_UV_DELTA=100000 MIF_UV_MAX=1150000"
          # wie v24-therm + RAM 1716 @ +150 mV
          - name: v26-ram150
            env: "CPU_UV_DELTA=0 GPU_TOP_EXTRA_UV=50000 THERMAL_SHIFT=20 MIF_KHZ=1716000 MIF_UV_DELTA=150000 MIF_UV_MAX=1150000"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Pakete
        run: sudo apt-get update && sudo apt-get install -y bc bison flex libssl-dev python2 device-tree-compiler cpio
      - name: Toolchain
        run: git clone --depth 1 -b lineage-19.0 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 $HOME/tc
      - name: Bauen
        shell: bash
        run: |
          set -eo pipefail
          export ${{ matrix.env }}
          export NAME=${{ matrix.name }}
          bash scripts/a5ultra/build.sh $HOME/tc/bin/aarch64-linux-android- 2>&1 | tail -200
          test -f arch/arm64/boot/Image
          mkdir out
          cp arch/arm64/boot/Image out/Image_${{ matrix.name }}
          cp arch/arm64/boot/dtb.img out/dtb_${{ matrix.name }}.img
          grep ECT_OC .config > out/config_${{ matrix.name }}.txt
          ls -la out
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $TAG >/dev/null 2>&1 || gh release create $TAG --target "$GITHUB_SHA" --title "A5 Ultra $TAG (Test)" --notes "Kernel-Image + dtb, mit swapkernel.py in boot_v21_backup.img einsetzen" || true
          sleep 5
          gh release upload $TAG out/* --clobber
