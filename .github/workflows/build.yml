name: Build Samsung Galaxy A5 Ultra
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Quellcode laden
        uses: actions/checkout@v4
      - name: Build-Pakete & ARM64 Toolchain installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf imagemagick fonts-dejavu-core liblz4-tool libncurses5 libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip unzip zlib1g-dev python2 gcc-aarch64-linux-gnu
      - name: Samsung Galaxy A5 Ultra Modern Flagship Dynamic Hardware Overhaul
        run: |
          set -e
          DTS_FILE=$(find arch/arm64/boot/dts -name "exynos7880.dtsi" | head -n 1)
          GPU_FILE=$(find drivers/gpu/arm -name "gpu_exynos7880.c" | head -n 1)
          CPU_CAL=$(find drivers/cpufreq -name "exynos-mp-cpufreq-cal.c" | head -n 1)
          DEFCONFIG=$(find arch/arm64/configs -name "*a5y17lte*" | head -n 1)
          sed -i 's/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-Samsung-Galaxy-A5-Ultra"/g' "$DEFCONFIG"
          grep -q "CONFIG_LOCALVERSION=" "$DEFCONFIG" || echo 'CONFIG_LOCALVERSION="-Samsung-Galaxy-A5-Ultra"' >> "$DEFCONFIG"
          echo -e "CONFIG_SECURITY_SELINUX_DEVELOP=y\nCONFIG_DEVMEM=y\nCONFIG_KALLSYMS_ALL=y\nCONFIG_CRYPTO_CRC32C=y\nCONFIG_CRYPTO_LZ4=y\nCONFIG_KSM=y\nCONFIG_HZ_1000=y\n# CONFIG_HZ_250 is not set\n# CONFIG_MMC_SPI_CRC_ON is not set\nCONFIG_TCP_CONG_ADVANCED=y\nCONFIG_TCP_CONG_BBR=y\nCONFIG_TCP_CONG_WESTWOOD=y\nCONFIG_DEFAULT_BBR=y\nCONFIG_DEFAULT_TCP_CONG=\"bbr\"" >> "$DEFCONFIG"
          find arch/arm64/boot/dts -type f -name "*.dts*" -exec sed -i 's/ibi,cpu_freq = <[^>]*>/ibi,cpu_freq = <1794000 1352000 0>/g; s/ibi,mif_freq = <[^>]*>/ibi,mif_freq = <1794000 1014000 0>/g; s/debounce-interval = <[0-9]*>/debounce-interval = <2>/g; s/samsung,duty = <[0-9]*>/samsung,duty = <1000>/g; s/samsung,max_timeout = <[0-9]*>/samsung,max_timeout = <8>/g' {} + 2>/dev/null || true
          find drivers/motor drivers/net/wireless/bcmdhd drivers/nfc drivers/sensors drivers/media/platform/exynos drivers/usb/typec drivers/fingerprint drivers/input/touchscreen -type f -name "*.c" -exec sed -i 's/overdrive = false/overdrive = true/g; s/overdrive = 0/overdrive = 1/g; s/msleep(20)/msleep(2)/g; s/msleep(15)/msleep(2)/g; s/msleep(10)/msleep(1)/g' {} + 2>/dev/null || true
          find drivers/thermal/samsung -type f -name "*.c" -exec sed -i 's/90000/95000/g; s/95000/98000/g' {} + 2>/dev/null || true
          sed -i 's/cl0_boot_max_qos = <2002000>;/cl0_boot_max_qos = <1794000>;/g; s/cl1_boot_max_qos = <2002000>;/cl1_boot_max_qos = <1794000>;/g; s/0  2002000  1200000  1014000/0  2106000  1300000  1014000/g; s/1  1872000  1200000  1014000/1  2054000  1285000  1014000/g; s/1  1924000  1200000  1014000/1  2054000  1285000  1014000/g; s/freq_info = <1539000 450000 450000 1539000 450000 1539000>;/freq_info = <1539000 450000 450000 1794000 450000 1794000>;/g' "$DTS_FILE"
          [ -f "$CPU_CAL" ] && sed -i 's/if (ptr->freq_table\[i\].frequency != (unsigned int)ptr_temp_table\[i\].rate)/if (i >= 1 \&\& ptr->freq_table\[i\].frequency != (unsigned int)ptr_temp_table\[i\].rate)/g' "$CPU_CAL"
          sed -i 's/{1138, 950000, 0, 98, 100, 1, 0, 1539000/{1300, 1075000, 0, 55, 100, 1, 0, 1794000/g; s/{1086, 925000, 0, 98, 100, 1, 0, 1539000/{1248, 1045000, 0, 55, 100, 1, 0, 1794000/g; s/{GPU_MAX_CLOCK, 1138}/{GPU_MAX_CLOCK, 950}/g; s/{GPU_MAX_CLOCK_LIMIT, 1138}/{GPU_MAX_CLOCK_LIMIT, 1300}/g; s/{GPU_MAX_VOLTAGE, [0-9]*}/{GPU_MAX_VOLTAGE, 1150000}/g; s/{TEMP_THROTTLING1, [0-9]*}/{TEMP_THROTTLING1, 95}/g; s/{TEMP_THROTTLING2, [0-9]*}/{TEMP_THROTTLING2, 98}/g; s/{TEMP_THROTTLING3, [0-9]*}/{TEMP_THROTTLING3, 100}/g; s/{TEMP_THROTTLING4, [0-9]*}/{TEMP_THROTTLING4, 102}/g' "$GPU_FILE"
          find drivers/battery* -type f -name "*.c" -exec sed -i 's/\<1650\>/2400/g; s/\<1800\>/2400/g; s/\<475\>/1100/g' {} + 2>/dev/null || true
          find drivers/mmc -type f -name "*.c" -exec sed -i 's/bool use_spi_crc = 1;/bool use_spi_crc = 0;/g' {} + 2>/dev/null || true
      - name: Kernel & Boot-Image direkt bauen
        run: |
          export ARCH=arm64 SUBARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          make $(basename $(find arch/arm64/configs -name "*a5y17lte*" | head -n 1))
          make -j$(nproc) KCFLAGS="-Wno-error" Image dtbs
          test -f arch/arm64/boot/Image
      - name: OneUI 2.5 Boot-Image & TWRP Flash-ZIP bauen
        run: |
          mkdir -p "$GITHUB_WORKSPACE/output" "$GITHUB_WORKSPACE/ultra_zip/META-INF/com/google/android"
          DTB_FILE=$(find arch/arm64/boot -name "*.dtb" | head -n 1)
          AIK_DIR=$(find "$GITHUB_WORKSPACE/rise" -ipath "*OneUI*" -name "repackimg.sh" -printf "%h\n" | head -n 1)
          [ -z "$AIK_DIR" ] && AIK_DIR=$(find "$GITHUB_WORKSPACE/rise" -name "repackimg.sh" -printf "%h\n" | tail -n 1)
          cp "$GITHUB_WORKSPACE/arch/arm64/boot/Image" "$AIK_DIR/split_img/boot.img-zImage"
          [ -n "$DTB_FILE" ] && cp "$DTB_FILE" "$AIK_DIR/split_img/boot.img-dtb"
          (cd "$AIK_DIR" && chmod +x repackimg.sh && ./repackimg.sh) || true
          NEW_BOOT=$(ls -t $(find "$GITHUB_WORKSPACE/rise" -type f -name "*.img") 2>/dev/null | head -n 1)
          cp "$NEW_BOOT" "$GITHUB_WORKSPACE/ultra_zip/boot.img"
          printf "SEANDROIDENFORCE" >> "$GITHUB_WORKSPACE/ultra_zip/boot.img"
          cp "$GITHUB_WORKSPACE/ultra_zip/boot.img" "$GITHUB_WORKSPACE/output/boot_Samsung_Galaxy_A5_Ultra_Pure.img"
          convert -size 1080x1920 xc:black -font DejaVu-Sans-Bold -gravity center -fill white -pointsize 46 -annotate +0-110 "SAMSUNG" -fill white -pointsize 82 -annotate +0-20 "Galaxy A5 Ultra" -fill "#D0D0D0" -pointsize 26 -annotate +0+720 "POWERED BY" -fill white -pointsize 44 -annotate +0+765 "android" -quality 95 "$GITHUB_WORKSPACE/ultra_zip/logo.jpg" || true
                    printf '#!/system/bin/sh\nsleep 25\nsetenforce 0 2>/dev/null\nsysctl -w kernel.panic=0 2>/dev/null; sysctl -w kernel.panic_on_oops=0 2>/dev/null\nstop diagexe 2>/dev/null; stop ddexe 2>/dev/null\nfor cpu in /sys/devices/system/cpu/cpu[0-7]/cpufreq; do echo interactive > "$cpu/scaling_governor" 2>/dev/null; echo 344000 > "$cpu/scaling_min_freq" 2>/dev/null; echo 1794000 > "$cpu/scaling_max_freq" 2>/dev/null; echo 75 > "$cpu/interactive/go_hispeed_load" 2>/dev/null; echo 10000 > "$cpu/interactive/timer_rate" 2>/dev/null; echo 15000 > "$cpu/interactive/above_hispeed_delay" 2>/dev/null; done\nfor c in /sys/devices/system/cpu/cpu[0-7]/online; do echo 1 > "$c" 2>/dev/null; done\necho 950 > /sys/devices/11400000.mali/max_clock 2>/dev/null; echo 343 > /sys/devices/11400000.mali/min_clock 2>/dev/null\necho 10000 > /sys/class/timed_output/vibrator/intensity 2>/dev/null; echo 10000 > /sys/devices/virtual/timed_output/vibrator/intensity 2>/dev/null\necho 1 > /sys/kernel/mm/ksm/run 2>/dev/null\nswapoff /dev/block/zram0 2>/dev/null; echo 1 > /sys/block/zram0/reset 2>/dev/null; echo 8 > /sys/block/zram0/max_comp_streams 2>/dev/null; echo lz4 > /sys/block/zram0/comp_algorithm 2>/dev/null; echo 4831838208 > /sys/block/zram0/disksize 2>/dev/null; mkswap /dev/block/zram0 2>/dev/null; swapon /dev/block/zram0 2>/dev/null\necho 100 > /proc/sys/vm/swappiness 2>/dev/null; echo 0 > /proc/sys/vm/page-cluster 2>/dev/null; echo 40 > /proc/sys/vm/vfs_cache_pressure 2>/dev/null; echo 35 > /proc/sys/vm/dirty_ratio 2>/dev/null; echo 15 > /proc/sys/vm/dirty_background_ratio 2>/dev/null; echo 32768 > /proc/sys/vm/min_free_kbytes 2>/dev/null\nfor q in /sys/block/mmcblk*/queue; do echo fiops > "$q/scheduler" 2>/dev/null; echo 4096 > "$q/read_ahead_kb" 2>/dev/null; echo 512 > "$q/nr_requests" 2>/dev/null; echo 0 > "$q/iostats" 2>/dev/null; done\nfstrim -v /data 2>/dev/null; fstrim -v /cache 2>/dev/null\nsysctl -w net.ipv4.tcp_congestion_control=bbr 2>/dev/null; sysctl -w net.ipv4.tcp_fastopen=3 2>/dev/null; sysctl -w net.ipv4.tcp_low_latency=1 2>/dev/null; sysctl -w net.core.default_qdisc=fq_codel 2>/dev/null; sysctl -w net.core.rmem_max=16777216 2>/dev/null; sysctl -w net.core.wmem_max=16777216 2>/dev/null\necho 1 > /sys/class/sec/tsp/cmd_dt2w 2>/dev/null\nsettings put system min_refresh_rate 80.0 2>/dev/null; settings put system peak_refresh_rate 80.0 2>/dev/null; settings put system haptic_feedback_enabled 1 2>/dev/null; settings put system VIB_FEEDBACK_MAGNITUDE 5 2>/dev/null\nsettings put global window_animation_scale 0.25 2>/dev/null; settings put global transition_animation_scale 0.25 2>/dev/null; settings put global animator_duration_scale 0.25 2>/dev/null\ncmd package bg-dexopt-job 2>/dev/null &\n' > "$GITHUB_WORKSPACE/ultra_zip/ultra_autotune.sh"
          printf '#!/system/bin/sh\ncase "$1" in\n  dynamic) for cpu in /sys/devices/system/cpu/cpu[0-7]/cpufreq; do echo interactive > "$cpu/scaling_governor"; echo 344000 > "$cpu/scaling_min_freq"; echo 2106000 > "$cpu/scaling_max_freq"; done; echo 1 > /sys/devices/11400000.mali/dvfs 2>/dev/null; echo 1300 > /sys/devices/11400000.mali/max_clock 2>/dev/null; echo "A5 ULTRA: DYNAMIC FLAGSHIP (344-2106MHz CPU + 343-1300MHz GPU)!";;\n  overdrive|benchmark) for cpu in /sys/devices/system/cpu/cpu[0-7]/cpufreq; do echo performance > "$cpu/scaling_governor"; echo 2106000 > "$cpu/scaling_min_freq"; echo 2106000 > "$cpu/scaling_max_freq"; done; echo 0 > /sys/devices/11400000.mali/dvfs 2>/dev/null; echo 1300 > /sys/devices/11400000.mali/clock 2>/dev/null; echo "A5 ULTRA: FULL BENCHMARK LOCK!";;\n  safe) for cpu in /sys/devices/system/cpu/cpu[0-7]/cpufreq; do echo interactive > "$cpu/scaling_governor"; echo 344000 > "$cpu/scaling_min_freq"; echo 1794000 > "$cpu/scaling_max_freq"; done; echo 1 > /sys/devices/11400000.mali/dvfs 2>/dev/null; echo 950 > /sys/devices/11400000.mali/max_clock 2>/dev/null; echo "A5 ULTRA: SAFE COOLING MODE!";;\n  boost) sync; echo 3 > /proc/sys/vm/drop_caches; fstrim -v /data 2>/dev/null; fstrim -v /cache 2>/dev/null; echo "A5 ULTRA: CACHE BEREINIGT!";;\n  *) echo "Nutze hKtweaks oder: a5ultra dynamic | overdrive | safe | boost";;\nesac\n' > "$GITHUB_WORKSPACE/ultra_zip/a5ultra_cli.sh"
          printf '#!/sbin/sh\nSYS="/system"; [ -d "/system/system" ] && SYS="/system/system"; PROP="$SYS/build.prop"\nif [ -f "$PROP" ]; then\n  sed -i "s/ro.product.model=.*/ro.product.model=Galaxy A5 Ultra/g; s/ro.product.system.model=.*/ro.product.system.model=Galaxy A5 Ultra/g; s/ro.product.vendor.model=.*/ro.product.vendor.model=Galaxy A5 Ultra/g" "$PROP"\n  grep -q "Samsung Galaxy A5 Ultra" "$PROP" || printf "\\nro.boot.warranty_bit=0\\nro.warranty_bit=0\\ndebug.sf.hw=1\\ndebug.egl.hw=1\\ndebug.composition.type=gpu\\ndebug.hwui.renderer=skiagl\\nro.hwui.use_vulkan=true\\ndebug.sf.latch_unsignaled=1\\ndebug.sf.disable_backpressure=1\\nro.surface_flinger.vsync_event_phase_offset_ns=2000000\\nro.surface_flinger.max_frame_buffer_acquired_buffers=3\\nro.hwui.render_ahead=3\\nro.hwui.texture_cache_size=256\\nro.vendor.display.burnin_protection=1\\ndalvik.vm.dex2oat-filter=speed\\ndalvik.vm.usejit=true\\ndalvik.vm.usejitprofiles=true\\ndalvik.vm.heapsize=512m\\ndebug.sqlite.syncmode=OFF\\nro.sys.fw.bg_apps_limit=32\\nwindowsmgr.max_events_per_sec=360\\nro.min.fling_velocity=8000\\nro.max.fling_velocity=16000\\nro.media.enc.jpeg.quality=100\\nro.media.enc.hprof.vid.bps=100000000\\nro.media.enc.hprof.vid.fps=60\\npersist.camera.HAL3.enabled=1\\npersist.camera.eis.enable=1\\npersist.camera.4k2k.enable=1\\npersist.camera.hdr.enable=true\\ncamera.disable_zsl_mode=0\\npersist.camera.zsl.buffer.size=5\\naf.resampler.quality=255\\naudio.offload.pcm.24bit.enable=true\\naudio.deep_buffer.media=false\\nusb.audio.highres=true\\npersist.bt.a2dp.aptx_hd=true\\npersist.audio.fluence.voicecall=true\\nro.config.media_vol_steps=30\\npersist.dbg.ims_volte_enable=1\\npersist.dbg.volte_avail_ovr=1\\npersist.dbg.wfc_avail_ovr=1\\nro.gps.agps_provider=1\\nnet.dns1=1.1.1.1\\nnet.dns2=8.8.8.8\\n" >> "$PROP"\nfi\nfor F in $(find "$SYS" /vendor -name "floating_feature*.xml" 2>/dev/null); do sed -i "s/DOLBY_ATMOS>FALSE/DOLBY_ATMOS>TRUE/g; s/UHQ_UPSCALER>FALSE/UHQ_UPSCALER>TRUE/g; s/GAME_TOOLS>FALSE/GAME_TOOLS>TRUE/g; s/SUPPORT_AOD>FALSE/SUPPORT_AOD>TRUE/g; s/HAPTIC_FEEDBACK_ON_TOUCH>FALSE/HAPTIC_FEEDBACK_ON_TOUCH>TRUE/g" "$F"; done\nfor C in $(find "$SYS" /vendor -name "camera-feature*.xml" 2>/dev/null); do sed -i "s/4K_UHD\\" value=\\"false\\"/4K_UHD\\" value=\\"true\\"/g; s/60FPS\\" value=\\"false\\"/60FPS\\" value=\\"true\\"/g; s/PRO_MODE\\" value=\\"false\\"/PRO_MODE\\" value=\\"true\\"/g; s/RAW_CAPTURE\\" value=\\"false\\"/RAW_CAPTURE\\" value=\\"true\\"/g; s/NIGHT_SHOT\\" value=\\"false\\"/NIGHT_SHOT\\" value=\\"true\\"/g; s/SUPER_SLOW_MOTION\\" value=\\"false\\"/SUPER_SLOW_MOTION\\" value=\\"true\\"/g; s/LIVE_FOCUS\\" value=\\"false\\"/LIVE_FOCUS\\" value=\\"true\\"/g; s/PRO_VIDEO\\" value=\\"false\\"/PRO_VIDEO\\" value=\\"true\\"/g; s/SUPER_STEADY\\" value=\\"false\\"/SUPER_STEADY\\" value=\\"true\\"/g" "$C"; done\nfor M in $(find "$SYS" /vendor -name "media_profiles*.xml" 2>/dev/null); do sed -i "s/maxFrameWidth=\\"1920\\"/maxFrameWidth=\\"3840\\"/g; s/maxFrameHeight=\\"1080\\"/maxFrameHeight=\\"2160\\"/g; s/maxBitRate=\\"17000000\\"/maxBitRate=\\"100000000\\"/g; s/maxFrameRate=\\"30\\"/maxFrameRate=\\"60\\"/g" "$M"; done\nfor X in $(find "$SYS" /vendor -name "mixer_paths*.xml" 2>/dev/null); do sed -i "s/value=\\"84\\"/value=\\"96\\"/g; s/value=\\"86\\"/value=\\"98\\"/g; s|<path name=\\"speaker\\">|<path name=\\"speaker\\"><ctl name=\\"EAR Switch\\" value=\\"1\\" /><ctl name=\\"Earpiece Volume\\" value=\\"94\\" />|g" "$X"; done\nmkdir -p "$SYS/etc/init.d"; cp /tmp/ultra/ultra_autotune.sh "$SYS/etc/init.d/99a5ultra"; chmod 0755 "$SYS/etc/init.d/99a5ultra"; cp /tmp/ultra/a5ultra_cli.sh "$SYS/bin/a5ultra"; chmod 0755 "$SYS/bin/a5ultra"\nUP_PARAM=$(find /dev/block -iname "up_param" -o -iname "param" | head -n 1)\nif [ -n "$UP_PARAM" ] && [ -f "/tmp/ultra/logo.jpg" ]; then mkdir -p /tmp/param; dd if="$UP_PARAM" of=/tmp/param.bin; cd /tmp/param && tar -xf /tmp/param.bin 2>/dev/null; cp /tmp/ultra/logo.jpg /tmp/param/logo.jpg; cp /tmp/ultra/logo.jpg /tmp/param/logo.bmp; tar -cf /tmp/param_new.bin *; dd if=/tmp/param_new.bin of="$UP_PARAM"; fi\nexit 0\n' > "$GITHUB_WORKSPACE/ultra_zip/ultra_patch.sh"
          printf '#!/sbin/sh\nOUTFD=$2; ZIP=$3\nui_print() { echo "ui_print $1" >&$OUTFD; }\nui_print "SAMSUNG GALAXY A5 ULTRA (MODERN DYNAMIC FLAGSHIP)!"\nunzip -o "$ZIP" -d /tmp/ultra\ndd if=/tmp/ultra/boot.img of=/dev/block/platform/13550000.dwmmc0/by-name/BOOT 2>/dev/null || dd if=/tmp/ultra/boot.img of=/dev/block/by-name/BOOT 2>/dev/null\nmount -o rw /system 2>/dev/null || mount -o rw /system_root 2>/dev/null; mount -o rw /vendor 2>/dev/null; mount -o rw /data 2>/dev/null\nsh /tmp/ultra/ultra_patch.sh\numount /system 2>/dev/null || umount /system_root 2>/dev/null; umount /vendor 2>/dev/null\nui_print "FERTIG! Jetzt Magisk flashen & starten!"\nexit 0\n' > "$GITHUB_WORKSPACE/ultra_zip/META-INF/com/google/android/update-binary"
          cd "$GITHUB_WORKSPACE/ultra_zip" && zip -r9 "$GITHUB_WORKSPACE/output/Samsung-Galaxy-A5-Ultra-Pure.zip" .
      - name: Als GitHub Artifact bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Samsung-Galaxy-A5-Ultra-Pure
          path: output/

