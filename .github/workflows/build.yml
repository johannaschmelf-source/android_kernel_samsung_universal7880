name: Build A5 Ultra Magisk Module
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-magisk-mod:
    runs-on: ubuntu-22.04
    steps:
      - name: Magisk-Modul & Bootlogo-ZIP bauen
        run: |
          set -e
          sudo apt-get update && sudo apt-get install -y zip imagemagick fonts-dejavu-core
          mkdir -p "$GITHUB_WORKSPACE/output" "$GITHUB_WORKSPACE/mod/META-INF/com/google/android" "$GITHUB_WORKSPACE/mod/common"
          convert -size 1080x1920 xc:black -font DejaVu-Sans-Bold -gravity center -fill white -pointsize 46 -annotate +0-110 "SAMSUNG" -fill white -pointsize 82 -annotate +0-20 "Galaxy A5 Ultra" -fill "#D0D0D0" -pointsize 26 -annotate +0+720 "POWERED BY" -fill white -pointsize 44 -annotate +0+765 "android" -strip -interlace none -quality 85 "JPEG:$GITHUB_WORKSPACE/mod/common/logo.jpg"
          printf 'id=a5ultra\nname=Samsung Galaxy A5 Ultra Edition\nversion=v1.0\nversionCode=1\nauthor=A5Ultra\ndescription=Galaxy A5 Ultra Modellname, 4K Kamera, Stereo Audio, 4.5GB ZRAM & Hardware Boost\n' > "$GITHUB_WORKSPACE/mod/module.prop"
          printf 'ro.product.model=Galaxy A5 Ultra\nro.product.system.model=Galaxy A5 Ultra\nro.product.vendor.model=Galaxy A5 Ultra\nro.product.odm.model=Galaxy A5 Ultra\ndebug.sf.hw=1\ndebug.egl.hw=1\ndebug.composition.type=gpu\ndebug.hwui.renderer=skiagl\nro.hwui.use_vulkan=true\nro.vendor.display.burnin_protection=1\npersist.camera.HAL3.enabled=1\npersist.camera.eis.enable=1\npersist.camera.4k2k.enable=1\npersist.camera.hdr.enable=true\nro.media.enc.jpeg.quality=100\nro.media.enc.hprof.vid.bps=100000000\nro.media.enc.hprof.vid.fps=60\naudio.offload.pcm.24bit.enable=true\npersist.bt.a2dp.aptx_hd=true\nro.config.media_vol_steps=30\nnet.dns1=1.1.1.1\nnet.dns2=8.8.8.8\n' > "$GITHUB_WORKSPACE/mod/common/system.prop"
          printf '#!/system/bin/sh\nsleep 15\nfor c in /sys/devices/system/cpu/cpu[0-7]/cpufreq; do echo interactive > "$c/scaling_governor" 2>/dev/null; echo 344000 > "$c/scaling_min_freq" 2>/dev/null; echo 2002000 > "$c/scaling_max_freq" 2>/dev/null; done\necho 1 > /sys/devices/11400000.mali/highspeed_load 2>/dev/null\necho 10000 > /sys/class/timed_output/vibrator/intensity 2>/dev/null; echo 10000 > /sys/devices/virtual/timed_output/vibrator/intensity 2>/dev/null\nswapoff /dev/block/zram0 2>/dev/null; echo 1 > /sys/block/zram0/reset 2>/dev/null; echo 8 > /sys/block/zram0/max_comp_streams 2>/dev/null; echo lz4 > /sys/block/zram0/comp_algorithm 2>/dev/null; echo 4831838208 > /sys/block/zram0/disksize 2>/dev/null; mkswap /dev/block/zram0 2>/dev/null; swapon /dev/block/zram0 2>/dev/null\necho 100 > /proc/sys/vm/swappiness 2>/dev/null; echo 0 > /proc/sys/vm/page-cluster 2>/dev/null\nfor q in /sys/block/mmcblk*/queue; do echo fiops > "$q/scheduler" 2>/dev/null; echo 4096 > "$q/read_ahead_kb" 2>/dev/null; echo 512 > "$q/nr_requests" 2>/dev/null; done\nsysctl -w net.ipv4.tcp_congestion_control=bbr 2>/dev/null; sysctl -w net.core.default_qdisc=fq_codel 2>/dev/null\nsettings put global window_animation_scale 0.25 2>/dev/null; settings put global transition_animation_scale 0.25 2>/dev/null; settings put global animator_duration_scale 0.25 2>/dev/null\n' > "$GITHUB_WORKSPACE/mod/common/service.sh"
          printf '#!/sbin/sh\nOUTFD=$2; ZIP=$3\nui_print() { echo "ui_print $1" >&$OUTFD; }\nui_print "Installiere SAMSUNG GALAXY A5 ULTRA MODUL..."\nMODPATH=/data/adb/modules/a5ultra\nrm -rf "$MODPATH"; mkdir -p "$MODPATH/system/etc"\nunzip -o "$ZIP" -d /tmp/m\ncp /tmp/m/module.prop "$MODPATH/module.prop"\ncp /tmp/m/common/system.prop "$MODPATH/system.prop"\ncp /tmp/m/common/service.sh "$MODPATH/service.sh"\nchmod 0755 "$MODPATH/service.sh"\nfor SRC in /system/etc/mixer_paths*.xml /vendor/etc/mixer_paths*.xml; do\n  if [ -f "$SRC" ]; then\n    DST="$MODPATH/system/etc/$(basename "$SRC")"\n    cp "$SRC" "$DST"\n    sed -i "s/value=\\"84\\"/value=\\"96\\"/g; s/value=\\"86\\"/value=\\"98\\"/g; s|<path name=\\"speaker\\">|<path name=\\"speaker\\"><ctl name=\\"EAR Switch\\" value=\\"1\\" /><ctl name=\\"Earpiece Volume\\" value=\\"94\\" />|g" "$DST"\n  fi\ndone\nUP=$(find /dev/block -iname "up_param" -o -iname "param" | head -n 1)\nif [ -n "$UP" ]; then mkdir -p /tmp/p && cd /tmp/p && dd if="$UP" of=param.bin && tar -xf param.bin && cp /tmp/m/common/logo.jpg /tmp/p/logo.jpg && rm -f param.bin && tar --format=ustar -cf param_new.bin * && dd if=param_new.bin of="$UP"; fi\nui_print "FERTIG! Einfach neu starten!"\nexit 0\n' > "$GITHUB_WORKSPACE/mod/META-INF/com/google/android/update-binary"
          printf '#MAGISK\n' > "$GITHUB_WORKSPACE/mod/META-INF/com/google/android/updater-script"
          cd "$GITHUB_WORKSPACE/mod" && zip -r9 "$GITHUB_WORKSPACE/output/Galaxy-A5-Ultra-Magisk-Modul.zip" .
      - name: Als GitHub Artifact bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-A5-Ultra-Magisk-Modul
          path: output/
