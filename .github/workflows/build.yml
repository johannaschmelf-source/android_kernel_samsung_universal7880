name: Build Samsung Galaxy A5 Ultra

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Quellcode laden
        uses: actions/checkout@v4

      - name: Build-Pakete & ARM64 Toolchain installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf imagemagick liblz4-tool libncurses5 libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip unzip zlib1g-dev python2 python3-pil gcc-aarch64-linux-gnu

      - name: Samsung Galaxy A5 Ultra Ultimate Hardware & Driver Overhaul
        run: |
          set -e
          DTS_FILE=$(find arch/arm64/boot/dts -name "exynos7880.dtsi" | head -n 1)
          GPU_FILE=$(find drivers/gpu/arm -name "gpu_exynos7880.c" | head -n 1)
          CPU_CAL=$(find drivers/cpufreq -name "exynos-mp-cpufreq-cal.c" | head -n 1)
          DEFCONFIG=$(find arch/arm64/configs -name "*a5y17lte*" | head -n 1)

          echo "Gefundene Defconfig: $DEFCONFIG"
          test -f "$DTS_FILE" && test -f "$GPU_FILE" && test -f "$DEFCONFIG"

          sed -i 's/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-Samsung-Galaxy-A5-Ultra-APEX"/g' "$DEFCONFIG"
          grep -q "CONFIG_LOCALVERSION=" "$DEFCONFIG" || echo 'CONFIG_LOCALVERSION="-Samsung-Galaxy-A5-Ultra-APEX"' >> "$DEFCONFIG"
          echo "CONFIG_SECURITY_SELINUX_DEVELOP=y" >> "$DEFCONFIG"
          echo "CONFIG_CRYPTO_CRC32C=y" >> "$DEFCONFIG"
          echo "CONFIG_CRYPTO_LZ4=y" >> "$DEFCONFIG"

          find arch/arm64/boot/dts -type f -name "*.dts*" -exec sed -i 's/refresh = <60>;/refresh = <80>;/g; s/fps = <60>;/fps = <80>;/g; s/panel-refresh-rate = <60>;/panel-refresh-rate = <80>;/g' {} + 2>/dev/null || true
          find drivers/video/fbdev/exynos -type f -name "*.c" -exec sed -i 's/hbm_mode = 0/hbm_mode = 1/g' {} + 2>/dev/null || true

          sed -i 's/cl0_boot_max_qos = <2002000>;/cl0_boot_max_qos = <1794000>;/g' "$DTS_FILE"
          sed -i 's/cl1_boot_max_qos = <2002000>;/cl1_boot_max_qos = <1794000>;/g' "$DTS_FILE"
          sed -i 's/0  2002000  1200000  1014000/0  2054000  1250000  1014000/g' "$DTS_FILE"
          sed -i 's/1  1872000  1200000  1014000/1  2002000  1200000  1014000/g' "$DTS_FILE"
          sed -i 's/1  1924000  1200000  1014000/1  2002000  1200000  1014000/g' "$DTS_FILE"
          if [ -f "$CPU_CAL" ]; then
            sed -i 's/if (ptr->freq_table\[i\].frequency != (unsigned int)ptr_temp_table\[i\].rate)/if (i >= 1 \&\& ptr->freq_table\[i\].frequency != (unsigned int)ptr_temp_table\[i\].rate)/g' "$CPU_CAL"
          fi

          sed -i 's/{1138, 950000, 0, 98, 100, 1, 0, 1539000/{1248, 1035000, 0, 98, 100, 1, 0, 1794000/g' "$GPU_FILE"
          sed -i 's/{1086, 925000, 0, 98, 100, 1, 0, 1539000/{1196, 995000, 0, 98, 100, 1, 0, 1794000/g' "$GPU_FILE"
          sed -i 's/{GPU_MAX_CLOCK, 1138}/{GPU_MAX_CLOCK, 1196}/g' "$GPU_FILE"
          sed -i 's/{GPU_MAX_CLOCK_LIMIT, 1138}/{GPU_MAX_CLOCK_LIMIT, 1248}/g' "$GPU_FILE"
          sed -i 's/{GPU_MAX_VOLTAGE, [0-9]*}/{GPU_MAX_VOLTAGE, 1125000}/g' "$GPU_FILE"

          sed -i 's/freq_info = <1539000 450000 450000 1539000 450000 1539000>;/freq_info = <1539000 450000 450000 1794000 450000 1794000>;/g' "$DTS_FILE"

          find arch/arm64/boot/dts -type f -name "*.dts*" -exec sed -i 's/ibi,cpu_freq = <[^>]*>/ibi,cpu_freq = <2054000 1794000 0>/g; s/ibi,mif_freq = <[^>]*>/ibi,mif_freq = <1794000 1539000 0>/g' {} + 2>/dev/null || true
          find drivers/fingerprint -type f -name "*.c" -exec sed -i 's/msleep(20)/msleep(5)/g; s/msleep(10)/msleep(3)/g' {} + 2>/dev/null || true
          find drivers/input/touchscreen -type f -name "*.c" -exec sed -i 's/msleep(20)/msleep(5)/g; s/msleep(15)/msleep(4)/g' {} + 2>/dev/null || true

          sed -i 's/{TEMP_THROTTLING1, [0-9]*}/{TEMP_THROTTLING1, 95}/g' "$GPU_FILE"
          sed -i 's/{TEMP_THROTTLING2, [0-9]*}/{TEMP_THROTTLING2, 97}/g' "$GPU_FILE"
          sed -i 's/{TEMP_THROTTLING3, [0-9]*}/{TEMP_THROTTLING3, 99}/g' "$GPU_FILE"
          sed -i 's/{TEMP_THROTTLING4, [0-9]*}/{TEMP_THROTTLING4, 101}/g' "$GPU_FILE"

          find drivers/battery* -type f -name "*.c" -exec sed -i 's/\<1650\>/2500/g; s/\<1800\>/2500/g; s/\<475\>/1200/g' {} + 2>/dev/null || true

          echo "CONFIG_HZ_1000=y" >> "$DEFCONFIG"
          echo "# CONFIG_HZ_250 is not set" >> "$DEFCONFIG"
          echo "# CONFIG_MMC_SPI_CRC_ON is not set" >> "$DEFCONFIG"
          echo "CONFIG_TCP_CONG_ADVANCED=y" >> "$DEFCONFIG"
          echo "CONFIG_TCP_CONG_BBR=y" >> "$DEFCONFIG"
          echo "CONFIG_DEFAULT_BBR=y" >> "$DEFCONFIG"
          echo 'CONFIG_DEFAULT_TCP_CONG="bbr"' >> "$DEFCONFIG"
          find drivers/mmc -type f -name "*.c" -exec sed -i 's/bool use_spi_crc = 1;/bool use_spi_crc = 0;/g' {} + 2>/dev/null || true

      - name: Kernel & Boot-Image direkt bauen (Samsung Galaxy A5 Ultra)
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          DEFNAME=$(basename $(find arch/arm64/configs -name "*a5y17lte*" | head -n 1))
          echo "Kompiliere mit Defconfig: $DEFNAME"
          make "$DEFNAME"
          make -j$(nproc) KCFLAGS="-Wno-error" Image dtbs
          test -f arch/arm64/boot/Image

      - name: All-In-One TWRP Flash-ZIP bauen & direkt als Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/output"
          mkdir -p "$GITHUB_WORKSPACE/ultra_zip/META-INF/com/google/android"

          DTB_FILE=$(find arch/arm64/boot -name "*.dtb" | head -n 1)
          RAMDISK=$(find rise -name "*ramdisk*" -type f | head -n 1)
          echo "Image: arch/arm64/boot/Image | DTB: $DTB_FILE | Ramdisk: $RAMDISK"

          python3 -c 'import os, struct; k = open("arch/arm64/boot/Image", "rb").read(); dtb_p = os.environ.get("DTB_FILE", ""); ram_p = os.environ.get("RAMDISK", ""); d = open(dtb_p, "rb").read() if dtb_p and os.path.isfile(dtb_p) else b""; r = open(ram_p, "rb").read() if ram_p and os.path.isfile(ram_p) else b""; pad = lambda b: b + b"\x00" * ((2048 - len(b) % 2048) % 2048); hdr = struct.pack("<8sIIIIIIIIII16s512s", b"ANDROID!", len(k), 0x10008000, len(r), 0x11000000, 0, 0x10f00000, 0x10000100, 2048, len(d), 0, b"A5Ultra", b""); open("ultra_zip/boot.img", "wb").write(pad(hdr) + pad(k) + pad(r) + pad(d))' DTB_FILE="$DTB_FILE" RAMDISK="$RAMDISK"

          cp "$GITHUB_WORKSPACE/ultra_zip/boot.img" "$GITHUB_WORKSPACE/output/boot_Samsung_Galaxy_A5_Ultra.img"

          python3 -c 'from PIL import Image, ImageDraw; img = Image.new("RGB", (1080, 1920), "black"); d = ImageDraw.Draw(img); d.text((430, 780), "SAMSUNG", fill="white"); d.text((340, 860), "GALAXY A5 ULTRA", fill=(0, 168, 255)); d.text((250, 950), "80Hz AMOLED  |  2054MHz CPU  |  1248MHz GPU", fill=(180, 180, 180)); d.text((280, 1650), "4K 80Mbit Cam  |  Dolby Stereo  |  Apex Ultra", fill=(110, 110, 110)); img.save("ultra_zip/logo.jpg", quality=92)'

          printf '#!/system/bin/sh\nsleep 20\nsetenforce 0 2>/dev/null\nstop diagexe 2>/dev/null\nstop ddexe 2>/dev/null\nfor cpu in /sys/devices/system/cpu/cpu[0-7]/cpufreq; do\n  [ -d "$cpu" ] && echo 344000 > "$cpu/scaling_min_freq" 2>/dev/null && echo 2054000 > "$cpu/scaling_max_freq" 2>/dev/null\ndone\nfor c in /sys/devices/system/cpu/cpu[0-7]/online; do\n  echo 1 > "$c" 2>/dev/null\ndone\nfor gov in /sys/devices/system/cpu/cpu*/cpufreq/interactive; do\n  if [ -d "$gov" ]; then\n    echo 45 > "$gov/go_hispeed_load" 2>/dev/null\n    echo 2054000 > "$gov/hispeed_freq" 2>/dev/null\n    echo 0 > "$gov/above_hispeed_delay" 2>/dev/null\n    echo 10000 > "$gov/timer_rate" 2>/dev/null\n    echo 40000 > "$gov/min_sample_time" 2>/dev/null\n  fi\ndone\nswapoff /dev/block/zram0 2>/dev/null\necho 1 > /sys/block/zram0/reset 2>/dev/null\necho lz4 > /sys/block/zram0/comp_algorithm 2>/dev/null\necho 3221225472 > /sys/block/zram0/disksize 2>/dev/null\nmkswap /dev/block/zram0 2>/dev/null\nswapon /dev/block/zram0 2>/dev/null\necho 100 > /proc/sys/vm/swappiness 2>/dev/null\necho 50 > /proc/sys/vm/vfs_cache_pressure 2>/dev/null\necho "1536,2048,4096,8192,16384,24576" > /sys/module/lowmemorykiller/parameters/minfree 2>/dev/null\nfor q in /sys/block/mmcblk*/queue; do\n  echo fiops > "$q/scheduler" 2>/dev/null || echo deadline > "$q/scheduler" 2>/dev/null\n  echo 2048 > "$q/read_ahead_kb" 2>/dev/null\n  echo 256 > "$q/nr_requests" 2>/dev/null\n  echo 0 > "$q/iostats" 2>/dev/null\ndone\nfstrim -v /data 2>/dev/null\nfstrim -v /cache 2>/dev/null\nsysctl -w net.ipv4.tcp_congestion_control=bbr 2>/dev/null\nsysctl -w net.ipv4.tcp_fastopen=3 2>/dev/null\nsysctl -w net.core.rmem_max=8388608 2>/dev/null\nsysctl -w net.core.wmem_max=8388608 2>/dev/null\nsettings put global window_animation_scale 0.5 2>/dev/null\nsettings put global transition_animation_scale 0.5 2>/dev/null\nsettings put global animator_duration_scale 0.5 2>/dev/null\nsettings put global force_resizable_activities 1 2>/dev/null\nsettings put global enable_freeform_support 1 2>/dev/null\ncmd package bg-dexopt-job 2>/dev/null &\n' > "$GITHUB_WORKSPACE/ultra_zip/ultra_autotune.sh"

