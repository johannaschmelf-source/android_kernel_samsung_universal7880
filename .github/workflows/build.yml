name: Build Overclocked Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Quellcode laden
        uses: actions/checkout@v4

      - name: Build-Pakete installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python2

      - name: Kernel bauen (OneUI 10.0 A5)
        run: |
          chmod +x build_rise.sh
          printf "y\n7\na5\nn\n" | ./build_rise.sh

      - name: Build-Log prüfen falls Fehler
        if: always()
        run: |
          if [ -f rise/build.log ]; then tail -n 50 rise/build.log; fi

      - name: Fertige boot.img hochladen
        uses: actions/upload-artifact@v4
        with:
          name: riseKernel-OC-A5-OneUI10
          path: rise/boot_*.img
