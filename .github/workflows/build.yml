name: Build Samsung Galaxy A5 Ultra

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Quellcode laden
        uses: actions/checkout@v4

      - name: Build-Pakete & ARM64 Toolchain installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf imagemagick fonts-dejavu-core liblz4-tool libncurses5 libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip unzip zlib1g-dev python2 gcc-aarch64-linux-gnu

      - name: Samsung Galaxy A5 Ultra Complete Silicon & Driver Overhaul
        run: |
          set -e
          DTS_FILE=$(find arch/arm64/boot/dts -name "exynos7880.dtsi" | head -n 1)
          GPU_FILE=$(find drivers/gpu/arm -name "gpu_exynos7880.c" | head -n 1)
          CPU_CAL=$(find drivers/cpufreq -name "exynos-mp-cpufreq-cal.c" | head -n 1)
          DEFCONFIG=$(find arch/arm64/configs -name "*a5y17lte*" | head -n 1)

          echo "Gefundene Defconfig: $DEFCONFIG"
          test -f "$DTS_FILE" && test -f "$GPU_FILE" && test -f "$DEFCONFIG"

          sed -i 's/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-Samsung-Galaxy-A5-Ultra"/g' "$DEFCONFIG"
          grep -q "CONFIG_LOCALVERSION=" "$DEFCONFIG" || echo 'CONFIG_LOCALVERSION="-Samsung-Galaxy-A5-Ultra"' >> "$DEFCONFIG"
          echo "CONFIG_SECURITY_SELINUX_DEVELOP=y" >> "$DEFCONFIG"
          echo "CONFIG_CRYPTO_CRC32C=y" >> "$DEFCONFIG"
          echo "CONFIG_CRYPTO_LZ4=y" >> "$DEFCONFIG"

          find arch/arm64/boot/dts -type f -name "*.dts*" -exec sed -i 's/refresh = <60>;/refresh = <80>;/g; s/fps = <60>;/fps = <80>;/g; s/panel-refresh-rate = <60>;/panel-refresh-rate = <80>;/g' {} + 2>/dev/null || true
          find drivers/video/fbdev/exynos -type f -name "*.c" -exec sed -i 's/hbm_mode = 0/hbm_mode = 1/g' {} + 2>/dev/null || true

          sed -i 's/cl0_boot_max_qos = <2002000>;/cl0_boot_max_qos = <1794000>;/g' "$DTS_FILE"
          sed -i 's/cl1_boot_max_qos = <2002000>;/cl1_boot_max_qos = <1794000>;/g' "$DTS_FILE"
          sed -i 's/0  2002000  1200000  1014000/0  2158000  1300000  1014000/g' "$DTS_FILE"
          sed -i 's/1  1872000  1200000  1014000/1  2054000  1275000  1014000/g' "$DTS_FILE"
          sed -i 's/1  1924000  1200000  1014000/1  2054000  1275000  1014000/g' "$DTS_FILE"
          if [ -f "$CPU_CAL" ]; then
            sed -i 's/if (ptr->freq_table\[i\].frequency != (unsigned int)ptr_temp_table\[i\].rate)/if (i >= 1 \&\& ptr->freq_table\[i\].frequency != (unsigned int)ptr_temp_table\[i\].rate)/g' "$CPU_CAL"
          fi

          sed -i 's/{1138, 950000, 0, 98, 100, 1, 0, 1539000/{1300, 1060000, 0, 70, 100, 1, 0, 1794000/g' "$GPU_FILE"
          sed -i 's/{1086, 925000, 0, 98, 100, 1, 0, 1539000/{1248, 1020000, 0, 65, 100, 1, 0, 1794000/g' "$GPU_FILE"
          sed -i 's/{GPU_MAX_CLOCK, 1138}/{GPU_MAX_CLOCK, 1248}/g' "$GPU_FILE"
          sed -i 's/{GPU_MAX_CLOCK_LIMIT, 1138}/{GPU_MAX_CLOCK_LIMIT, 1300}/g' "$GPU_FILE"
          sed -i 's/{GPU_MAX_VOLTAGE, [0-9]*}/{GPU_MAX_VOLTAGE, 1150000}/g' "$GPU_FILE"

          sed -i 's/freq_info = <1539000 450000 450000 1539000 450000 1539000>;/freq_info = <1539000 450000 450000 1794000 450000 1794000>;/g' "$DTS_FILE"

          find arch/arm64/boot/dts -type f -name "*.dts*" -exec sed -i 's/ibi,cpu_freq = <[^>]*>/ibi,cpu_freq = <2158000 1794000 0>/g; s/ibi,mif_freq = <[^>]*>/ibi,mif_freq = <1794000 1539000 0>/g; s/debounce-interval = <[0-9]*>/debounce-interval = <2>/g' {} + 2>/dev/null || true
          find drivers/fingerprint -type f -name "*.c" -exec sed -i 's/msleep(20)/msleep(3)/g; s/msleep(10)/msleep(2)/g' {} + 2>/dev/null || true
          find drivers/input/touchscreen -type f -name "*.c" -exec sed -i 's/msleep(20)/msleep(3)/g; s/msleep(15)/msleep(2)/g; s/msleep(10)/msleep(2)/g' {} + 2>/dev/null || true

          sed -i 's/{TEMP_THROTTLING1, [0-9]*}/{TEMP_THROTTLING1, 98}/g' "$GPU_FILE"
          sed -i 's/{TEMP_THROTTLING2, [0-9]*}/{TEMP_THROTTLING2, 100}/g' "$GPU_FILE"
          sed -i 's/{TEMP_THROTTLING3, [0-9]*}/{TEMP_THROTTLING3, 102}/g' "$GPU_FILE"
          sed -i 's/{TEMP_THROTTLING4, [0-9]*}/{TEMP_THROTTLING4, 104}/g' "$GPU_FILE"

          find drivers/battery* -type f -name "*.c" -exec sed -i 's/\<1650\>/2600/g; s/\<1800\>/2600/g; s/\<475\>/1200/g' {} + 2>/dev/null || true

          echo "CONFIG_HZ_1000=y" >> "$DEFCONFIG"
          echo "# CONFIG_HZ_250 is not set" >> "$DEFCONFIG"
          echo "# CONFIG_MMC_SPI_CRC_ON is not set" >> "$DEFCONFIG"
          echo "CONFIG_TCP_CONG_ADVANCED=y" >> "$DEFCONFIG"
          echo "CONFIG_TCP_CONG_BBR=y" >> "$DEFCONFIG"
          echo "CONFIG_DEFAULT_BBR=y" >> "$DEFCONFIG"
          echo 'CONFIG_DEFAULT_TCP_CONG="bbr"' >> "$DEFCONFIG"
          find drivers/mmc -type f -name "*.c" -exec sed -i 's/bool use_spi_crc = 1;/bool use_spi_crc = 0;/g' {} + 2>/dev/null || true

      - name: Kernel & Boot-Image direkt bauen (Samsung Galaxy A5 Ultra)
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          DEFNAME=$(basename $(find arch/arm64/configs -name "*a5y17lte*" | head -n 1))
          echo "Kompiliere mit Defconfig: $DEFNAME"
          make "$DEFNAME"
          make -j$(nproc) KCFLAGS="-Wno-error" Image dtbs
          test -f arch/arm64/boot/Image

      - name: All-In-One TWRP Flash-ZIP bauen & vorbereiten
        run: |
          mkdir -p "$GITHUB_WORKSPACE/output"
          mkdir -p "$GITHUB_WORKSPACE/ultra_zip/META-INF/com/google/android"

          cp arch/arm64/boot/Image "$GITHUB_WORKSPACE/output/Image_Samsung_Galaxy_A5_Ultra"
          DTB_FILE=$(find arch/arm64/boot -name "*.dtb" | head -n 1)
          [ -n "$DTB_FILE" ] && cp "$DTB_FILE" "$GITHUB_WORKSPACE/output/dtb_Samsung_Galaxy_A5_Ultra.img"

          AIK_DIR=$(find "$GITHUB_WORKSPACE/rise" -name "repackimg.sh" -printf "%h\n" | head -n 1)
          echo "Nutze AIK in: $AIK_DIR"
          if [ -n "$AIK_DIR" ]; then
            cp "$GITHUB_WORKSPACE/arch/arm64/boot/Image" "$AIK_DIR/split_img/boot.img-zImage"
            [ -n "$DTB_FILE" ] && cp "$DTB_FILE" "$AIK_DIR/split_img/boot.img-dtb"
            (cd "$AIK_DIR" && chmod +x repackimg.sh && ./repackimg.sh) || true
            NEW_BOOT=$(find "$GITHUB_WORKSPACE/rise" -name "*image-new*" -o -name "*unsigned-new*" | head -n 1)
            echo "Gefundenes Boot-Image: $NEW_BOOT"
            if [ -n "$NEW_BOOT" ] && [ -f "$NEW_BOOT" ]; then
              cp "$NEW_BOOT" "$GITHUB_WORKSPACE/ultra_zip/boot.img"
            else
              cp "$GITHUB_WORKSPACE/arch/arm64/boot/Image" "$GITHUB_WORKSPACE/ultra_zip/boot.img"
            fi
          else
            cp "$GITHUB_WORKSPACE/arch/arm64/boot/Image" "$GITHUB_WORKSPACE/ultra_zip/boot.img"
          fi
          cp "$GITHUB_WORKSPACE/ultra_zip/boot.img" "$GITHUB_WORKSPACE/output/boot_Samsung_Galaxy_A5_Ultra.img"

          convert -size 1080x1920 xc:black -font DejaVu-Sans-Bold -gravity center -fill white -pointsize 58 -annotate +0-140 "SAMSUNG" -fill "#00A8FF" -pointsize 74 -annotate +0-40 "GALAXY A5 ULTRA" -fill "#B0B0B0" -pointsize 28 -annotate +0+60 "80Hz AMOLED  |  2158MHz CPU  |  1300MHz GPU" -fill "#707070" -pointsize 24 -annotate +0+680 "4K 80Mbit Cam  |  Dolby Atmos  |  1794MHz RAM" -quality 92 "$GITHUB_WORKSPACE/ultra_zip/logo.jpg" || true

          printf '#!/system/bin/sh\nsleep 20\nsetenforce 0 2>/dev/null\nstop diagexe 2>/dev/null\nstop ddexe 2>/dev/null\nfor cpu in /sys/devices/system/cpu/cpu[0-7]/cpufreq; do\n  [ -d "$cpu" ] && echo 344000 > "$cpu/scaling_min_freq" 2>/dev/null && echo 2158000 > "$cpu/scaling_max_freq" 2>/dev/null\ndone\nfor c in /sys/devices/system/cpu/cpu[0-7]/online; do\n  echo 1 > "$c" 2>/dev/null\ndone\nfor gov in /sys/devices/system/cpu/cpu*/cpufreq/interactive; do\n  if [ -d "$gov" ]; then\n    echo 40 > "$gov/go_hispeed_load" 2>/dev/null\n    echo 2158000 > "$gov/hispeed_freq" 2>/dev/null\n    echo 0 > "$gov/above_hispeed_delay" 2>/dev/null\n    echo 10000 > "$gov/timer_rate" 2>/dev/null\n    echo 40000 > "$gov/min_sample_time" 2>/dev/null\n  fi\ndone\nswapoff /dev/block/zram0 2>/dev/null\necho 1 > /sys/block/zram0/reset 2>/dev/null\necho lz4 > /sys/block/zram0/comp_algorithm 2>/dev/null\necho 3221225472 > /sys/block/zram0/disksize 2>/dev/null\nmkswap /dev/block/zram0 2>/dev/null\nswapon /dev/block/zram0 2>/dev/null\necho 100 > /proc/sys/vm/swappiness 2>/dev/null\necho 50 > /proc/sys/vm/vfs_cache_pressure 2>/dev/null\necho 40 > /proc/sys/vm/dirty_ratio 2>/dev/null\necho "1536,2048,4096,8192,16384,24576" > /sys/module/lowmemorykiller/parameters/minfree 2>/dev/null\nfor q in /sys/block/mmcblk*/queue; do\n  echo fiops > "$q/scheduler" 2>/dev/null || echo deadline > "$q/scheduler" 2>/dev/null\n  echo 2048 > "$q/read_ahead_kb" 2>/dev/null\n  echo 256 > "$q/nr_requests" 2>/dev/null\n  echo 0 > "$q/iostats" 2>/dev/null\ndone\nfstrim -v /data 2>/dev/null\nfstrim -v /cache 2>/dev/null\nsysctl -w net.ipv4.tcp_congestion_control=bbr 2>/dev/null\nsysctl -w net.ipv4.tcp_fastopen=3 2>/dev/null\nsysctl -w net.core.rmem_max=8388608 2>/dev/null\nsysctl -w net.core.wmem_max=8388608 2>/dev/null\nsettings put global window_animation_scale 0.5 2>/dev/null\nsettings put global transition_animation_scale 0.5 2>/dev/null\nsettings put global animator_duration_scale 0.5 2>/dev/null\nsettings put global force_resizable_activities 1 2>/dev/null\nsettings put global enable_freeform_support 1 2>/dev/null\ncmd package bg-dexopt-job 2>/dev/null &\n' > "$GITHUB_WORKSPACE/ultra_zip/ultra_autotune.sh"

                    printf '#!/system/bin/sh\nif [ "$1" = "benchmark" ]; then\n  for c in /sys/devices/system/cpu/cpu[0-7]/online; do echo 1 > "$c" 2>/dev/null; done\n  for cpu in /sys/devices/system/cpu/cpu[0-7]/cpufreq; do echo performance > "$cpu/scaling_governor" 2>/dev/null; echo 2158000 > "$cpu/scaling_min_freq" 2>/dev/null; echo 2158000 > "$cpu/scaling_max_freq" 2>/dev/null; done\n  echo "A5 ULTRA: BENCHMARK BEAST MODE AKTIV (2158 MHz LOCKED)!"\nelse\n  for cpu in /sys/devices/system/cpu/cpu[0-7]/cpufreq; do echo interactive > "$cpu/scaling_governor" 2>/dev/null; echo 344000 > "$cpu/scaling_min_freq" 2>/dev/null; echo 2158000 > "$cpu/scaling_max_freq" 2>/dev/null; done\n  echo "A5 ULTRA: DAILY SMART MODE AKTIV (344 - 2158 MHz)"\nfi\n' > "$GITHUB_WORKSPACE/ultra_zip/a5ultra_cli.sh"

          printf '#!/sbin/sh\nSYS="/system"\n[ -d "/system/system" ] && SYS="/system/system"\nPROP="$SYS/build.prop"\nif [ -f "$PROP" ]; then\n  sed -i "s/ro.product.model=.*/ro.product.model=Galaxy A5 Ultra/g" "$PROP"\n  sed -i "s/ro.product.system.model=.*/ro.product.system.model=Galaxy A5 Ultra/g" "$PROP"\n  sed -i "s/ro.product.vendor.model=.*/ro.product.vendor.model=Galaxy A5 Ultra/g" "$PROP"\n  grep -q "Samsung Galaxy A5 Ultra" "$PROP" || printf "\\nro.boot.warranty_bit=0\\nro.warranty_bit=0\\ndebug.sf.hw=1\\ndebug.egl.hw=1\\ndebug.composition.type=gpu\\ndebug.hwui.renderer=skiagl\\nro.hwui.use_vulkan=true\\npersist.sys.ui.hw=1\\ndebug.sf.latch_unsignaled=1\\ndebug.sf.disable_backpressure=1\\nro.surface_flinger.max_frame_buffer_acquired_buffers=3\\nwindowsmgr.max_events_per_sec=360\\nro.min.fling_velocity=8000\\nro.max.fling_velocity=16000\\nro.hwui.texture_cache_size=128\\nro.hwui.layer_cache_size=64\\nro.config.zram=true\\ndalvik.vm.heapsize=512m\\ndalvik.vm.heapgrowthlimit=256m\\ndalvik.vm.image-dex2oat-filter=speed\\ndalvik.vm.dex2oat-filter=speed\\npersist.dbg.ims_volte_enable=1\\npersist.dbg.volte_avail_ovr=1\\npersist.dbg.wfc_avail_ovr=1\\npm.sleep_mode=1\\nfw.max_users=5\\nfw.show_multiuserui=1\\nro.media.enc.jpeg.quality=100\\nro.media.dec.jpeg.memcap=16000000\\nro.media.enc.hprof.vid.bps=80000000\\nro.media.enc.hprof.vid.fps=60\\npersist.camera.HAL3.enabled=1\\npersist.camera.eis.enable=1\\npersist.camera.4k2k.enable=1\\ncamera.disable_zsl_mode=0\\naf.resampler.quality=255\\npersist.audio.fluence.voicecall=true\\npersist.audio.fluence.speaker=true\\nro.config.vc_call_vol_steps=15\\nro.config.media_vol_steps=30\\n" >> "$PROP"\nfi\nfor FFEAT in $(find "$SYS" /vendor -name "floating_feature*.xml" 2>/dev/null); do\n  sed -i "s/SEC_FLOATING_FEATURE_COMMON_SUPPORT_EDGE_LIGHTING>FALSE/SEC_FLOATING_FEATURE_COMMON_SUPPORT_EDGE_LIGHTING>TRUE/g" "$FFEAT"\n  sed -i "s/SEC_FLOATING_FEATURE_COMMON_SUPPORT_SMART_VIEW>FALSE/SEC_FLOATING_FEATURE_COMMON_SUPPORT_SMART_VIEW>TRUE/g" "$FFEAT"\n  sed -i "s/SEC_FLOATING_FEATURE_COMMON_SUPPORT_SMART_CAPTURE>FALSE/SEC_FLOATING_FEATURE_COMMON_SUPPORT_SMART_CAPTURE>TRUE/g" "$FFEAT"\n  sed -i "s/SEC_FLOATING_FEATURE_AUDIO_SUPPORT_DOLBY_ATMOS>FALSE/SEC_FLOATING_FEATURE_AUDIO_SUPPORT_DOLBY_ATMOS>TRUE/g" "$FFEAT"\n  sed -i "s/SEC_FLOATING_FEATURE_AUDIO_SUPPORT_UHQ_UPSCALER>FALSE/SEC_FLOATING_FEATURE_AUDIO_SUPPORT_UHQ_UPSCALER>TRUE/g" "$FFEAT"\ndone\nfor CAMXML in $(find "$SYS" /vendor -name "camera-feature*.xml" 2>/dev/null); do\n  sed -i "s/SUPPORT_RECORDING_4K_UHD\\" value=\\"false\\"/SUPPORT_RECORDING_4K_UHD\\" value=\\"true\\"/g" "$CAMXML"\n  sed -i "s/SUPPORT_FRONT_RECORDING_4K_UHD\\" value=\\"false\\"/SUPPORT_FRONT_RECORDING_4K_UHD\\" value=\\"true\\"/g" "$CAMXML"\n  sed -i "s/SUPPORT_RECORDING_60FPS\\" value=\\"false\\"/SUPPORT_RECORDING_60FPS\\" value=\\"true\\"/g" "$CAMXML"\n  sed -i "s/SUPPORT_FRONT_RECORDING_60FPS\\" value=\\"false\\"/SUPPORT_FRONT_RECORDING_60FPS\\" value=\\"true\\"/g" "$CAMXML"\n  sed -i "s/SUPPORT_PRO_MODE\\" value=\\"false\\"/SUPPORT_PRO_MODE\\" value=\\"true\\"/g" "$CAMXML"\n  sed -i "s/SUPPORT_RAW_CAPTURE\\" value=\\"false\\"/SUPPORT_RAW_CAPTURE\\" value=\\"true\\"/g" "$CAMXML"\n  sed -i "s/SUPPORT_MOTION_PHOTO\\" value=\\"false\\"/SUPPORT_MOTION_PHOTO\\" value=\\"true\\"/g" "$CAMXML"\n  sed -i "s/SUPPORT_HYPERLAPSE\\" value=\\"false\\"/SUPPORT_HYPERLAPSE\\" value=\\"true\\"/g" "$CAMXML"\ndone\nfor MPROF in $(find "$SYS" /vendor -name "media_profiles*.xml" 2>/dev/null); do\n  sed -i "s/maxFrameWidth=\\"1920\\"/maxFrameWidth=\\"3840\\"/g" "$MPROF"\n  sed -i "s/maxFrameHeight=\\"1080\\"/maxFrameHeight=\\"2160\\"/g" "$MPROF"\n  sed -i "s/maxBitRate=\\"17000000\\"/maxBitRate=\\"80000000\\"/g" "$MPROF"\n  sed -i "s/maxBitRate=\\"20000000\\"/maxBitRate=\\"80000000\\"/g" "$MPROF"\n  sed -i "s/maxFrameRate=\\"30\\"/maxFrameRate=\\"60\\"/g" "$MPROF"\ndone\nfor MIX in $(find "$SYS" /vendor -name "mixer_paths*.xml" 2>/dev/null); do\n  sed -i "s/value=\\"84\\"/value=\\"92\\"/g; s/value=\\"86\\"/value=\\"94\\"/g" "$MIX"\ndone\nHOSTS="$SYS/etc/hosts"\nif [ -f "$HOSTS" ] && ! grep -q "A5 Ultra AdBlock" "$HOSTS"; then\n  printf "\\n# A5 Ultra AdBlock\\n0.0.0.0 doubleclick.net\\n0.0.0.0 googleadservices.com\\n0.0.0.0 ://googlesyndication.com\\n0.0.0.0 ://google.com\\n" >> "$HOSTS"\nfi\nGPS="$SYS/etc/gps.conf"\nif [ -f "$GPS" ] && ! grep -q "A5 Ultra GPS" "$GPS"; then\n  printf "\\n# A5 Ultra GPS\\nNTP_SERVER=de.pool.ntp.org\\nSUPL_HOST=://google.com\\nSUPL_PORT=7275\\n" >> "$GPS"\nfi\nmkdir -p "$SYS/etc/init.d"\ncp /tmp/ultra/ultra_autotune.sh "$SYS/etc/init.d/99a5ultra"\nchmod 0755 "$SYS/etc/init.d/99a5ultra"\ncp /tmp/ultra/a5ultra_cli.sh "$SYS/bin/a5ultra"\nchmod 0755 "$SYS/bin/a5ultra"\nif [ -d "/data/adb/service.d" ]; then\n  cp /tmp/ultra/ultra_autotune.sh "/data/adb/service.d/99a5ultra.sh"\n  chmod 0755 "/data/adb/service.d/99a5ultra.sh"\nfi\nUP_PARAM="/dev/block/platform/13540000.dwmmc0/by-name/UP_PARAM"\nif [ -e "$UP_PARAM" ] && [ -f "/tmp/ultra/logo.jpg" ]; then\n  mkdir -p /tmp/param\n  dd if="$UP_PARAM" of=/tmp/param.bin\n  cd /tmp/param && tar -xf /tmp/param.bin 2>/dev/null\n  if [ -f "/tmp/param/logo.jpg" ]; then\n    cp /tmp/ultra/logo.jpg /tmp/param/logo.jpg\n    tar -cf /tmp/param_new.bin *\n    dd if=/tmp/param_new.bin of="$UP_PARAM"\n  fi\nfi\n' > "$GITHUB_WORKSPACE/ultra_zip/ultra_patch.sh"

          printf '#!/sbin/sh\nOUTFD=$2\nZIP=$3\nui_print() { echo "ui_print $1" >&$OUTFD; echo "ui_print" >&$OUTFD; }\nui_print "================================================"\nui_print "   SAMSUNG GALAXY A5 ULTRA - MASTER EDITION     "\nui_print "   BOOTLOGO | 80Hz AMOLED | 2158MHz | 1300MHz   "\nui_print "   1794MHz RAM | 3.0GB ZRAM | 4K CAM | DOLBY    "\nui_print "================================================"\nunzip -o "$ZIP" -d /tmp/ultra\ndd if=/tmp/ultra/boot.img of=/dev/block/platform/13540000.dwmmc0/by-name/BOOT\nmount /system 2>/dev/null || mount /system_root 2>/dev/null\nmount /vendor 2>/dev/null\nmount /data 2>/dev/null\nsh /tmp/ultra/ultra_patch.sh\numount /system 2>/dev/null || umount /system_root 2>/dev/null\numount /vendor 2>/dev/null\nui_print "-> ALLES FERTIG! Direkt Magisk flashen & starten!"\n' > "$GITHUB_WORKSPACE/ultra_zip/META-INF/com/google/android/update-binary"

          cd "$GITHUB_WORKSPACE/ultra_zip"
          zip -r9 "$GITHUB_WORKSPACE/output/Samsung-Galaxy-A5-Ultra-APEX.zip" .
          ls -lh "$GITHUB_WORKSPACE/output/"


      - name: Als GitHub Artifact bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Samsung-Galaxy-A5-Ultra-APEX
          path: output/

      - name: Direkt als GitHub Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete a5-ultra-latest -y 2>/dev/null || true
          gh release create a5-ultra-latest "$GITHUB_WORKSPACE/output/"* --target rise --title "Samsung Galaxy A5 Ultra (Apex Flagship Edition)" --notes "All-In-One TWRP Flash-ZIP + Einzel-Boot-Image (nach dem Flashen direkt Magisk-ZIP flashen!)"
