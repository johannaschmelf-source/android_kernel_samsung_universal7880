name: Build A5 Ultra Flagship Apex
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-apex:
    runs-on: ubuntu-22.04
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
      - name: Flagship Apex Flash-ZIP bauen
        run: |
          set -e
          sudo apt-get update && sudo apt-get install -y zip imagemagick fonts-dejavu-core
          ORIG_IMG=$(find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -name "*.img" | head -n 1)
          test -f "$ORIG_IMG"
          AIK_DIR=$(find "$GITHUB_WORKSPACE" -name "unpackimg.sh" -printf "%h\n" | head -n 1)
          cd "$AIK_DIR"
          chmod +x *.sh 2>/dev/null || true
          rm -rf split_img ramdisk
          cp "$ORIG_IMG" ./boot.img
          ./unpackimg.sh boot.img
          python3 -c '
          import glob
          pairs = [(2002000, 2106000), (1924000, 2054000), (1872000, 2054000), (1539000, 1794000), (1138, 1300), (1086, 1248)]
          for path in glob.glob("split_img/*"):
              try:
                  data = open(path, "rb").read()
                  new_data = data
                  for old, new in pairs:
                      for size in (8, 4):
                          for endian in ("big", "little"):
                              new_data = new_data.replace(old.to_bytes(size, endian), new.to_bytes(size, endian))
                  if new_data != data:
                      open(path, "wb").write(new_data)
              except Exception:
                  pass
          '
          ./repackimg.sh || true
          mkdir -p "$GITHUB_WORKSPACE/output" "$GITHUB_WORKSPACE/apex_zip/META-INF/com/google/android"
          NEW_IMG=$(ls -t $(find "$GITHUB_WORKSPACE" -type f -name "*.img" ! -name "boot.img" ! -path "$ORIG_IMG") | head -n 1)
          cp "$NEW_IMG" "$GITHUB_WORKSPACE/apex_zip/boot.img"
          convert -size 1080x1920 xc:black -font DejaVu-Sans-Bold -gravity center -fill white -pointsize 46 -annotate +0-110 "SAMSUNG" -fill white -pointsize 82 -annotate +0-20 "Galaxy A5 Ultra" -fill "#D0D0D0" -pointsize 26 -annotate +0+720 "POWERED BY" -fill white -pointsize 44 -annotate +0+765 "android" -strip -interlace none -quality 90 "JPEG:$GITHUB_WORKSPACE/apex_zip/logo.jpg"
          printf '#!/system/bin/sh\nsleep 15\nsetenforce 0 2>/dev/null\nstop diagexe 2>/dev/null; stop ddexe 2>/dev/null\nfor c in /sys/devices/system/cpu/cpu[0-7]/cpufreq; do echo interactive > "$c/scaling_governor" 2>/dev/null; echo 344000 > "$c/scaling_min_freq" 2>/dev/null; echo 2002000 > "$c/scaling_max_freq" 2>/dev/null; done\necho "always_on" > /sys/devices/11400000.mali/power_policy 2>/dev/null; echo 1 > /sys/devices/11400000.mali/highspeed_load 2>/dev/null\nfor d in /sys/class/devfreq/*mif* /sys/class/devfreq/*int*; do [ -f "$d/max_freq" ] && cat "$d/max_freq" > "$d/min_freq" 2>/dev/null; done\necho 10000 > /sys/class/timed_output/vibrator/intensity 2>/dev/null; echo 10000 > /sys/devices/virtual/timed_output/vibrator/intensity 2>/dev/null\necho "glove_mode,1" > /sys/class/sec/tsp/cmd 2>/dev/null\nswapoff /dev/block/zram0 2>/dev/null; echo 1 > /sys/block/zram0/reset 2>/dev/null; echo 8 > /sys/block/zram0/max_comp_streams 2>/dev/null; echo lz4 > /sys/block/zram0/comp_algorithm 2>/dev/null; echo 4831838208 > /sys/block/zram0/disksize 2>/dev/null; mkswap /dev/block/zram0 2>/dev/null; swapon /dev/block/zram0 2>/dev/null\necho 100 > /proc/sys/vm/swappiness 2>/dev/null; echo 0 > /proc/sys/vm/page-cluster 2>/dev/null; echo 40 > /proc/sys/vm/dirty_ratio 2>/dev/null; echo 1000 > /proc/sys/vm/dirty_expire_centisecs 2>/dev/null\nfor q in /sys/block/mmcblk*/queue; do echo fiops > "$q/scheduler" 2>/dev/null; echo 4096 > "$q/read_ahead_kb" 2>/dev/null; echo 512 > "$q/nr_requests" 2>/dev/null; done\nfstrim -v /data 2>/dev/null; fstrim -v /cache 2>/dev/null\nsysctl -w net.ipv4.tcp_congestion_control=bbr 2>/dev/null; sysctl -w net.core.default_qdisc=fq_codel 2>/dev/null\nsettings put global window_animation_scale 0.25 2>/dev/null; settings put global transition_animation_scale 0.25 2>/dev/null; settings put global animator_duration_scale 0.25 2>/dev/null\n' > "$GITHUB_WORKSPACE/apex_zip/99a5ultra.sh"
          printf '#!/sbin/sh\nfor P in /system/build.prop /system/system/build.prop /vendor/build.prop; do\n  if [ -f "$P" ]; then\n    sed -i "s/ro.product.model=.*/ro.product.model=Galaxy A5 Ultra/g; s/ro.product.system.model=.*/ro.product.system.model=Galaxy A5 Ultra/g; s/ro.product.vendor.model=.*/ro.product.vendor.model=Galaxy A5 Ultra/g" "$P"\n    grep -q "ro.hwui.use_vulkan" "$P" || printf "\\ndebug.sf.hw=1\\ndebug.egl.hw=1\\ndebug.composition.type=gpu\\ndebug.hwui.renderer=skiagl\\nro.hwui.use_vulkan=true\\nro.vendor.display.burnin_protection=1\\ndalvik.vm.dex2oat-filter=speed\\ndalvik.vm.heapsize=512m\\npersist.camera.HAL3.enabled=1\\npersist.camera.eis.enable=1\\npersist.camera.4k2k.enable=1\\npersist.camera.hdr.enable=true\\npersist.camera.zsl.buffer.size=5\\nro.media.enc.jpeg.quality=100\\nro.media.enc.hprof.vid.bps=100000000\\nro.media.enc.hprof.vid.fps=60\\naudio.offload.pcm.24bit.enable=true\\npersist.bt.a2dp.aptx_hd=true\\nro.config.media_vol_steps=30\\nro.config.vc_call_vol_steps=15\\nnet.dns1=1.1.1.1\\nnet.dns2=8.8.8.8\\npm.sleep_mode=1\\n" >> "$P"\n  fi\ndone\nfor F in $(find /system /vendor -name "floating_feature*.xml" 2>/dev/null); do sed -i "s/DOLBY_ATMOS>FALSE/DOLBY_ATMOS>TRUE/g; s/UHQ_UPSCALER>FALSE/UHQ_UPSCALER>TRUE/g; s/GAME_TOOLS>FALSE/GAME_TOOLS>TRUE/g; s/SUPPORT_AOD>FALSE/SUPPORT_AOD>TRUE/g; s/HAPTIC_FEEDBACK_ON_TOUCH>FALSE/HAPTIC_FEEDBACK_ON_TOUCH>TRUE/g" "$F"; done\nfor C in $(find /system /vendor -name "camera-feature*.xml" 2>/dev/null); do sed -i "s/4K_UHD\\" value=\\"false\\"/4K_UHD\\" value=\\"true\\"/g; s/60FPS\\" value=\\"false\\"/60FPS\\" value=\\"true\\"/g; s/PRO_MODE\\" value=\\"false\\"/PRO_MODE\\" value=\\"true\\"/g; s/RAW_CAPTURE\\" value=\\"false\\"/RAW_CAPTURE\\" value=\\"true\\"/g; s/NIGHT_SHOT\\" value=\\"false\\"/NIGHT_SHOT\\" value=\\"true\\"/g; s/PRO_VIDEO\\" value=\\"false\\"/PRO_VIDEO\\" value=\\"true\\"/g; s/SUPER_STEADY\\" value=\\"false\\"/SUPER_STEADY\\" value=\\"true\\"/g" "$C"; done\nfor M in $(find /system /vendor -name "media_profiles*.xml" 2>/dev/null); do sed -i "s/maxFrameWidth=\\"1920\\"/maxFrameWidth=\\"3840\\"/g; s/maxFrameHeight=\\"1080\\"/maxFrameHeight=\\"2160\\"/g; s/maxBitRate=\\"17000000\\"/maxBitRate=\\"100000000\\"/g; s/maxFrameRate=\\"30\\"/maxFrameRate=\\"60\\"/g" "$M"; done\nfor X in $(find /system /vendor -name "mixer_paths*.xml" 2>/dev/null); do sed -i "s/value=\\"84\\"/value=\\"96\\"/g; s/value=\\"86\\"/value=\\"98\\"/g; s|<path name=\\"speaker\\">|<path name=\\"speaker\\"><ctl name=\\"EAR Switch\\" value=\\"1\\" /><ctl name=\\"Earpiece Volume\\" value=\\"94\\" />|g" "$X"; done\nfor H in /system/etc/hosts /system/system/etc/hosts; do [ -f "$H" ] && ! grep -q "A5 Ultra" "$H" && printf "\\n# A5 Ultra AdBlock\\n0.0.0.0 doubleclick.net\\n0.0.0.0 googleadservices.com\\n0.0.0.0 ://googlesyndication.com\\n" >> "$H"; done\nfor G in /system/etc/gps.conf /system/system/etc/gps.conf; do [ -f "$G" ] && ! grep -q "A5 Ultra" "$G" && printf "\\n# A5 Ultra GPS\\nNTP_SERVER=de.pool.ntp.org\\nSUPL_HOST=://google.com\\nSUPL_PORT=7275\\n" >> "$G"; done\nmkdir -p /data/adb/service.d\ncp /tmp/apex/99a5ultra.sh /data/adb/service.d/99a5ultra.sh\nchmod 0755 /data/adb/service.d/99a5ultra.sh\nUP=$(find /dev/block -iname "up_param" -o -iname "param" | head -n 1)\nif [ -n "$UP" ]; then mkdir -p /tmp/p && cd /tmp/p && dd if="$UP" of=param.bin && tar -xf param.bin && cp /tmp/apex/logo.jpg /tmp/p/logo.jpg && rm -f param.bin && tar -cf param_new.bin * && dd if=param_new.bin of="$UP"; fi\nexit 0\n' > "$GITHUB_WORKSPACE/apex_zip/patch.sh"
          printf '#!/sbin/sh\nOUTFD=$2; ZIP=$3\nui_print() { echo "ui_print $1" >&$OUTFD; }\nui_print "SAMSUNG GALAXY A5 ULTRA FLAGSHIP APEX!"\nunzip -o "$ZIP" -d /tmp/apex\ndd if=/tmp/apex/boot.img of=/dev/block/platform/13550000.dwmmc0/by-name/BOOT 2>/dev/null || dd if=/tmp/apex/boot.img of=/dev/block/by-name/BOOT 2>/dev/null\nmount -o rw /data 2>/dev/null; mount -o rw /system 2>/dev/null || mount -o rw /system_root 2>/dev/null; mount -o rw /vendor 2>/dev/null\nsh /tmp/apex/patch.sh\numount /system 2>/dev/null || umount /system_root 2>/dev/null; umount /vendor 2>/dev/null\nui_print "FERTIG! Jetzt Magisk flashen & starten!"\nexit 0\n' > "$GITHUB_WORKSPACE/apex_zip/META-INF/com/google/android/update-binary"
          cd "$GITHUB_WORKSPACE/apex_zip" && zip -r9 "$GITHUB_WORKSPACE/output/Samsung-Galaxy-A5-Ultra-Apex.zip" .
      - name: Als GitHub Artifact bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Samsung-Galaxy-A5-Ultra-Apex
          path: output/
