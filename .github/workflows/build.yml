name: Patch Original Boot DTB
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-dtb:
    runs-on: ubuntu-22.04
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
      - name: Original-Boot-Image auf 2106 MHz & 1300 MHz patchen
        run: |
          set -e
          AIK_DIR=$(find . -ipath "*OneUI*" -name "repackimg.sh" -printf "%h\n" | head -n 1)
          [ -z "$AIK_DIR" ] && AIK_DIR=$(find . -name "repackimg.sh" -printf "%h\n" | tail -n 1)
          cd "$AIK_DIR"
          chmod +x *.sh 2>/dev/null || true
          ORIG_IMG=$(find "$GITHUB_WORKSPACE" -type f -name "*a5*.img" -o -name "boot.img" | head -n 1)
          if [ -n "$ORIG_IMG" ] && [ -f "./unpackimg.sh" ]; then
            cp "$ORIG_IMG" ./boot.img
            ./unpackimg.sh boot.img
          fi
          python3 -c '
          import glob
          for path in glob.glob("split_img/*"):
              try:
                  data = open(path, "rb").read()
                  new_data = (data
                      .replace((2002000).to_bytes(4, "big"), (2106000).to_bytes(4, "big"))
                      .replace((1924000).to_bytes(4, "big"), (2054000).to_bytes(4, "big"))
                      .replace((1872000).to_bytes(4, "big"), (2054000).to_bytes(4, "big"))
                      .replace((1138).to_bytes(4, "big"), (1300).to_bytes(4, "big"))
                      .replace((1086).to_bytes(4, "big"), (1248).to_bytes(4, "big")))
                  if new_data != data:
                      open(path, "wb").write(new_data)
                      print("Patched:", path)
              except Exception:
                  pass
          '
          ./repackimg.sh
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp image-new.img "$GITHUB_WORKSPACE/output/boot_A5_Ultra_DTB_OC.img"
          printf "SEANDROIDENFORCE" >> "$GITHUB_WORKSPACE/output/boot_A5_Ultra_DTB_OC.img"
      - name: Gepatchtes Boot-Image bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Samsung-Galaxy-A5-Ultra-DTB-OC
          path: output/
