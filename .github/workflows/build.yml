name: Build A5 Ultra Bootlogo ZIP
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-logo:
    runs-on: ubuntu-22.04
    steps:
      - name: Bootlogo-ZIP erzeugen
        run: |
          set -e
          sudo apt-get update && sudo apt-get install -y zip imagemagick fonts-dejavu-core
          mkdir -p "$GITHUB_WORKSPACE/output" "$GITHUB_WORKSPACE/logo_zip/META-INF/com/google/android"
          convert -size 1080x1920 xc:black -font DejaVu-Sans-Bold -gravity center -fill white -pointsize 46 -annotate +0-110 "SAMSUNG" -fill white -pointsize 82 -annotate +0-20 "Galaxy A5 Ultra" -fill "#D0D0D0" -pointsize 26 -annotate +0+720 "POWERED BY" -fill white -pointsize 44 -annotate +0+765 "android" -strip -interlace none -quality 90 "JPEG:$GITHUB_WORKSPACE/logo_zip/logo.jpg"
          printf '#!/sbin/sh\nOUTFD=$2; ZIP=$3\nui_print() { echo "ui_print $1" >&$OUTFD; }\nui_print "Installiere SAMSUNG Galaxy A5 Ultra Bootlogo..."\nunzip -o "$ZIP" -d /tmp/logo\nUP=$(find /dev/block -iname "up_param" -o -iname "param" | head -n 1)\nif [ -n "$UP" ]; then\n  mkdir -p /tmp/p && cd /tmp/p\n  dd if="$UP" of=param.bin\n  tar -xf param.bin\n  cp /tmp/logo/logo.jpg /tmp/p/logo.jpg\n  rm -f param.bin\n  tar -cf param_new.bin *\n  dd if=param_new.bin of="$UP"\n  ui_print "Bootlogo erfolgreich aktualisiert!"\nelse\n  ui_print "UP_PARAM nicht gefunden!"\nfi\nexit 0\n' > "$GITHUB_WORKSPACE/logo_zip/META-INF/com/google/android/update-binary"
          cd "$GITHUB_WORKSPACE/logo_zip" && zip -r9 "$GITHUB_WORKSPACE/output/A5-Ultra-Bootlogo.zip" .
      - name: Als GitHub Artifact bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: A5-Ultra-Bootlogo
          path: output/
