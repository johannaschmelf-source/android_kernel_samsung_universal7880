name: Build A5 Ultra Ultimate ZIP
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-ultimate:
    runs-on: ubuntu-22.04
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
      - name: Ultimate-Boot-Image & komplette TWRP-Flash-ZIP bauen
        run: |
          set -e
          sudo apt-get update && sudo apt-get install -y zip imagemagick fonts-dejavu-core
          ORIG_IMG=$(find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -name "*.img" | head -n 1)
          test -f "$ORIG_IMG"
          AIK_DIR=$(find "$GITHUB_WORKSPACE" -name "unpackimg.sh" -printf "%h\n" | head -n 1)
          cd "$AIK_DIR"
          chmod +x *.sh 2>/dev/null || true
          rm -rf split_img ramdisk
          cp "$ORIG_IMG" ./boot.img
          ./unpackimg.sh boot.img
          python3 -c '
          import glob
          pairs = [(2002000, 2106000), (1924000, 2054000), (1872000, 2054000), (1539000, 1794000), (1138, 1300), (1086, 1248)]
          for path in glob.glob("split_img/*"):
              try:
                  data = open(path, "rb").read()
                  new_data = data
                  for old, new in pairs:
                      for size in (8, 4):
                          for endian in ("big", "little"):
                              new_data = new_data.replace(old.to_bytes(size, endian), new.to_bytes(size, endian))
                  if new_data != data:
                      open(path, "wb").write(new_data)
              except Exception:
                  pass
          '
          ./repackimg.sh || true
          mkdir -p "$GITHUB_WORKSPACE/output" "$GITHUB_WORKSPACE/ult_zip/META-INF/com/google/android"
          NEW_IMG=$(ls -t $(find "$GITHUB_WORKSPACE" -type f -name "*.img" ! -name "boot.img" ! -path "$ORIG_IMG") | head -n 1)
          cp "$NEW_IMG" "$GITHUB_WORKSPACE/ult_zip/boot.img"
          convert -size 1080x1920 xc:black -font DejaVu-Sans-Bold -gravity center -fill white -pointsize 46 -annotate +0-110 "SAMSUNG" -fill white -pointsize 82 -annotate +0-20 "Galaxy A5 Ultra" -fill "#D0D0D0" -pointsize 26 -annotate +0+720 "POWERED BY" -fill white -pointsize 44 -annotate +0+765 "android" -quality 95 "$GITHUB_WORKSPACE/ult_zip/logo.jpg" || true
          printf '#!/system/bin/sh\nsleep 20\nsetenforce 0 2>/dev/null\nstop diagexe 2>/dev/null; stop ddexe 2>/dev/null\necho 1 > /sys/devices/11400000.mali/highspeed_load 2>/dev/null\necho 10000 > /sys/class/timed_output/vibrator/intensity 2>/dev/null; echo 10000 > /sys/devices/virtual/timed_output/vibrator/intensity 2>/dev/null\necho 1 > /sys/kernel/mm/ksm/run 2>/dev/null\nswapoff /dev/block/zram0 2>/dev/null; echo 1 > /sys/block/zram0/reset 2>/dev/null; echo 8 > /sys/block/zram0/max_comp_streams 2>/dev/null; echo lz4 > /sys/block/zram0/comp_algorithm 2>/dev/null; echo 4831838208 > /sys/block/zram0/disksize 2>/dev/null; mkswap /dev/block/zram0 2>/dev/null; swapon /dev/block/zram0 2>/dev/null\necho 100 > /proc/sys/vm/swappiness 2>/dev/null; echo 0 > /proc/sys/vm/page-cluster 2>/dev/null; echo 40 > /proc/sys/vm/vfs_cache_pressure 2>/dev/null; echo 32768 > /proc/sys/vm/min_free_kbytes 2>/dev/null\nfor q in /sys/block/mmcblk*/queue; do echo fiops > "$q/scheduler" 2>/dev/null; echo 4096 > "$q/read_ahead_kb" 2>/dev/null; echo 512 > "$q/nr_requests" 2>/dev/null; echo 0 > "$q/iostats" 2>/dev/null; done\nfstrim -v /data 2>/dev/null; fstrim -v /cache 2>/dev/null\nsysctl -w net.ipv4.tcp_congestion_control=bbr 2>/dev/null; sysctl -w net.ipv4.tcp_fastopen=3 2>/dev/null; sysctl -w net.core.default_qdisc=fq_codel 2>/dev/null; sysctl -w net.core.rmem_max=16777216 2>/dev/null; sysctl -w net.core.wmem_max=16777216 2>/dev/null\necho 1 > /sys/class/sec/tsp/cmd_dt2w 2>/dev/null\nsettings put global window_animation_scale 0.25 2>/dev/null; settings put global transition_animation_scale 0.25 2>/dev/null; settings put global animator_duration_scale 0.25 2>/dev/null\ncmd package bg-dexopt-job 2>/dev/null &\n' > "$GITHUB_WORKSPACE/ult_zip/99a5ultra"
          printf '#!/system/bin/sh\ncase "$1" in\n  benchmark|overdrive) for c in /sys/devices/system/cpu/cpu[0-7]/cpufreq; do echo performance > "$c/scaling_governor"; echo 2106000 > "$c/scaling_min_freq"; echo 2106000 > "$c/scaling_max_freq"; done; echo 0 > /sys/devices/11400000.mali/dvfs 2>/dev/null; echo 1300 > /sys/devices/11400000.mali/clock 2>/dev/null; echo "A5 ULTRA: BENCHMARK MAX LOCKED!";;\n  *) for c in /sys/devices/system/cpu/cpu[0-7]/cpufreq; do echo interactive > "$c/scaling_governor"; echo 344000 > "$c/scaling_min_freq"; echo 2106000 > "$c/scaling_max_freq"; done; echo 1 > /sys/devices/11400000.mali/dvfs 2>/dev/null; echo 1300 > /sys/devices/11400000.mali/max_clock 2>/dev/null; echo "A5 ULTRA: DYNAMIC FLAGSHIP MODE!";;\nesac\n' > "$GITHUB_WORKSPACE/ult_zip/a5ultra"
          printf '#!/sbin/sh\nfor P in /system/build.prop /system/system/build.prop /vendor/build.prop; do\n  if [ -f "$P" ]; then\n    sed -i "s/ro.product.model=.*/ro.product.model=Galaxy A5 Ultra/g; s/ro.product.system.model=.*/ro.product.system.model=Galaxy A5 Ultra/g; s/ro.product.vendor.model=.*/ro.product.vendor.model=Galaxy A5 Ultra/g" "$P"\n    grep -q "ro.hwui.use_vulkan" "$P" || printf "\\ndebug.sf.hw=1\\ndebug.egl.hw=1\\ndebug.composition.type=gpu\\ndebug.hwui.renderer=skiagl\\nro.hwui.use_vulkan=true\\ndebug.sf.latch_unsignaled=1\\ndebug.sf.disable_backpressure=1\\nro.surface_flinger.max_frame_buffer_acquired_buffers=3\\nro.hwui.render_ahead=3\\nro.hwui.texture_cache_size=256\\nro.vendor.display.burnin_protection=1\\ndalvik.vm.dex2oat-filter=speed\\ndalvik.vm.heapsize=512m\\ndebug.sqlite.syncmode=OFF\\nro.sys.fw.bg_apps_limit=32\\nwindowsmgr.max_events_per_sec=360\\nro.media.enc.jpeg.quality=100\\nro.media.enc.hprof.vid.bps=100000000\\nro.media.enc.hprof.vid.fps=60\\npersist.camera.HAL3.enabled=1\\npersist.camera.eis.enable=1\\npersist.camera.4k2k.enable=1\\npersist.camera.hdr.enable=true\\npersist.camera.zsl.buffer.size=5\\naudio.offload.pcm.24bit.enable=true\\npersist.bt.a2dp.aptx_hd=true\\nro.config.vc_call_vol_steps=15\\nro.config.media_vol_steps=30\\npersist.dbg.ims_volte_enable=1\\npersist.dbg.volte_avail_ovr=1\\npersist.dbg.wfc_avail_ovr=1\\nro.ril.fast.dormancy.rule=0\\nro.gps.agps_provider=1\\nnet.dns1=1.1.1.1\\nnet.dns2=8.8.8.8\\npm.sleep_mode=1\\n" >> "$P"\n  fi\ndone\nfor F in $(find /system /vendor -name "floating_feature*.xml" 2>/dev/null); do sed -i "s/DOLBY_ATMOS>FALSE/DOLBY_ATMOS>TRUE/g; s/UHQ_UPSCALER>FALSE/UHQ_UPSCALER>TRUE/g; s/GAME_TOOLS>FALSE/GAME_TOOLS>TRUE/g; s/SUPPORT_AOD>FALSE/SUPPORT_AOD>TRUE/g; s/HAPTIC_FEEDBACK_ON_TOUCH>FALSE/HAPTIC_FEEDBACK_ON_TOUCH>TRUE/g" "$F"; done\nfor C in $(find /system /vendor -name "camera-feature*.xml" 2>/dev/null); do sed -i "s/4K_UHD\\" value=\\"false\\"/4K_UHD\\" value=\\"true\\"/g; s/60FPS\\" value=\\"false\\"/60FPS\\" value=\\"true\\"/g; s/PRO_MODE\\" value=\\"false\\"/PRO_MODE\\" value=\\"true\\"/g; s/RAW_CAPTURE\\" value=\\"false\\"/RAW_CAPTURE\\" value=\\"true\\"/g; s/NIGHT_SHOT\\" value=\\"false\\"/NIGHT_SHOT\\" value=\\"true\\"/g; s/PRO_VIDEO\\" value=\\"false\\"/PRO_VIDEO\\" value=\\"true\\"/g; s/SUPER_STEADY\\" value=\\"false\\"/SUPER_STEADY\\" value=\\"true\\"/g" "$C"; done\nfor M in $(find /system /vendor -name "media_profiles*.xml" 2>/dev/null); do sed -i "s/maxFrameWidth=\\"1920\\"/maxFrameWidth=\\"3840\\"/g; s/maxFrameHeight=\\"1080\\"/maxFrameHeight=\\"2160\\"/g; s/maxBitRate=\\"17000000\\"/maxBitRate=\\"100000000\\"/g; s/maxFrameRate=\\"30\\"/maxFrameRate=\\"60\\"/g" "$M"; done\nfor X in $(find /system /vendor -name "mixer_paths*.xml" 2>/dev/null); do sed -i "s/value=\\"84\\"/value=\\"96\\"/g; s/value=\\"86\\"/value=\\"98\\"/g; s|<path name=\\"speaker\\">|<path name=\\"speaker\\"><ctl name=\\"EAR Switch\\" value=\\"1\\" /><ctl name=\\"Earpiece Volume\\" value=\\"94\\" />|g" "$X"; done\nfor H in /system/etc/hosts /system/system/etc/hosts; do [ -f "$H" ] && ! grep -q "A5 Ultra" "$H" && printf "\\n# A5 Ultra AdBlock\\n0.0.0.0 doubleclick.net\\n0.0.0.0 googleadservices.com\\n0.0.0.0 ://googlesyndication.com\\n" >> "$H"; done\nfor G in /system/etc/gps.conf /system/system/etc/gps.conf; do [ -f "$G" ] && ! grep -q "A5 Ultra" "$G" && printf "\\n# A5 Ultra GPS\\nNTP_SERVER=de.pool.ntp.org\\nSUPL_HOST=://google.com\\nSUPL_PORT=7275\\n" >> "$G"; done\nfor D in /system /system/system; do if [ -d "$D/etc" ]; then mkdir -p "$D/etc/init.d"; cp /tmp/ult/99a5ultra "$D/etc/init.d/99a5ultra"; chmod 0755 "$D/etc/init.d/99a5ultra"; cp /tmp/ult/a5ultra "$D/bin/a5ultra"; chmod 0755 "$D/bin/a5ultra"; fi; done\nUP_PARAM=$(find /dev/block -iname "up_param" -o -iname "param" | head -n 1)\nif [ -n "$UP_PARAM" ] && [ -f "/tmp/ult/logo.jpg" ]; then mkdir -p /tmp/param; dd if="$UP_PARAM" of=/tmp/param.bin; cd /tmp/param && tar -xf /tmp/param.bin 2>/dev/null; cp /tmp/ult/logo.jpg /tmp/param/logo.jpg; cp /tmp/ult/logo.jpg /tmp/param/logo.bmp; tar -cf /tmp/param_new.bin *; dd if=/tmp/param_new.bin of="$UP_PARAM"; fi\nexit 0\n' > "$GITHUB_WORKSPACE/ult_zip/patch.sh"
          printf '#!/sbin/sh\nOUTFD=$2; ZIP=$3\nui_print() { echo "ui_print $1" >&$OUTFD; }\nui_print "SAMSUNG GALAXY A5 ULTRA ULTIMATE EDITION!"\nunzip -o "$ZIP" -d /tmp/ult\ndd if=/tmp/ult/boot.img of=/dev/block/platform/13550000.dwmmc0/by-name/BOOT 2>/dev/null || dd if=/tmp/ult/boot.img of=/dev/block/by-name/BOOT 2>/dev/null\nmount -o rw /system 2>/dev/null || mount -o rw /system_root 2>/dev/null; mount -o rw /vendor 2>/dev/null\nsh /tmp/ult/patch.sh\numount /system 2>/dev/null || umount /system_root 2>/dev/null; umount /vendor 2>/dev/null\nui_print "FERTIG! Jetzt Magisk flashen & starten!"\nexit 0\n' > "$GITHUB_WORKSPACE/ult_zip/META-INF/com/google/android/update-binary"
          cd "$GITHUB_WORKSPACE/ult_zip" && zip -r9 "$GITHUB_WORKSPACE/output/Samsung-Galaxy-A5-Ultra-Ultimate.zip" .
      - name: Als GitHub Artifact bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Samsung-Galaxy-A5-Ultra-Ultimate
          path: output/
