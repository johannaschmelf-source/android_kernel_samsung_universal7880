name: Build Samsung Galaxy A5 Ultra
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Quellcode laden
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build-Pakete & Google GCC 4.9 Toolchain installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf liblz4-tool libncurses5-dev libssl-dev libxml2-utils lzop pngcrush rsync schedtool xsltproc zip unzip zlib1g-dev python2
          mkdir -p "$GITHUB_WORKSPACE/toolchain"
          git clone --depth=1 -b lineage-17.1 https://github.com "$GITHUB_WORKSPACE/toolchain/aarch64-linux-android-4.9" || git clone --depth=1 -b android-9.0.0_r49 https://googlesource.com "$GITHUB_WORKSPACE/toolchain/aarch64-linux-android-4.9"
      - name: Kernel anpassen & mit GCC 4.9 bauen
        run: |
          set -e
          DTS_FILE=$(find arch/arm64/boot/dts -name "exynos7880.dtsi" | head -n 1)
          GPU_FILE=$(find drivers/gpu/arm -name "gpu_exynos7880.c" | head -n 1)
          CPU_CAL=$(find drivers/cpufreq -name "exynos-mp-cpufreq-cal.c" | head -n 1)
          DEFCONFIG=$(find arch/arm64/configs -name "*a5y17lte*" | head -n 1)
          echo -e "CONFIG_HZ_1000=y\n# CONFIG_HZ_250 is not set\nCONFIG_KSM=y\nCONFIG_CRYPTO_LZ4=y\nCONFIG_TCP_CONG_ADVANCED=y\nCONFIG_TCP_CONG_BBR=y\nCONFIG_DEFAULT_BBR=y\nCONFIG_DEFAULT_TCP_CONG=\"bbr\"" >> "$DEFCONFIG"
          sed -i 's/cl0_boot_max_qos = <2002000>;/cl0_boot_max_qos = <1794000>;/g; s/cl1_boot_max_qos = <2002000>;/cl1_boot_max_qos = <1794000>;/g; s/0  2002000  1200000  1014000/0  2106000  1300000  1014000/g; s/1  1872000  1200000  1014000/1  2054000  1285000  1014000/g; s/1  1924000  1200000  1014000/1  2054000  1285000  1014000/g' "$DTS_FILE"
          [ -f "$CPU_CAL" ] && sed -i 's/if (ptr->freq_table\[i\].frequency != (unsigned int)ptr_temp_table\[i\].rate)/if (i >= 1 \&\& ptr->freq_table\[i\].frequency != (unsigned int)ptr_temp_table\[i\].rate)/g' "$CPU_CAL"
          sed -i 's/{1138, 950000, 0, 98, 100, 1, 0, 1539000/{1300, 1075000, 0, 55, 100, 1, 0, 1794000/g; s/{GPU_MAX_CLOCK, 1138}/{GPU_MAX_CLOCK, 950}/g; s/{GPU_MAX_CLOCK_LIMIT, 1138}/{GPU_MAX_CLOCK_LIMIT, 1300}/g; s/{GPU_MAX_VOLTAGE, [0-9]*}/{GPU_MAX_VOLTAGE, 1150000}/g' "$GPU_FILE"
          find drivers/battery* -type f -name "*.c" -exec sed -i 's/\<1650\>/2400/g; s/\<1800\>/2400/g; s/\<475\>/1100/g' {} + 2>/dev/null || true
          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchain/aarch64-linux-android-4.9/bin/aarch64-linux-android-"
          export ARCH=arm64
          export SUBARCH=arm64
          chmod +x build.sh
          printf "1\n1\n" | ./build.sh || ./build.sh a5y17lte oneui || ./build.sh
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp $(ls -t $(find "$GITHUB_WORKSPACE" -type f -name "*.img") | head -n 1) "$GITHUB_WORKSPACE/output/boot_Samsung_Galaxy_A5_Ultra_GCC49.img"
      - name: Als GitHub Artifact bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Samsung-Galaxy-A5-Ultra-GCC49
          path: output/
