name: Build Samsung Galaxy A5 Ultra

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Quellcode laden
        uses: actions/checkout@v4

      - name: Build-Pakete installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python2 python3-pil

      - name: Samsung Galaxy A5 Ultra Adaptive Flagship Hardware Unlock
        run: |
          set -e
          DTS_FILE=$(find arch/arm64/boot/dts -name "exynos7880.dtsi" | head -n 1)
          GPU_FILE=$(find drivers/gpu/arm -name "gpu_exynos7880.c" | head -n 1)
          CPU_CAL=$(find drivers/cpufreq -name "exynos-mp-cpufreq-cal.c" | head -n 1)
          DEFCONFIG=$(find arch/arm64/configs -name "*a5y17lte*" | head -n 1)

          test -f "$DTS_FILE" && test -f "$GPU_FILE" && test -f "$DEFCONFIG"

          # 1. Offizielle Kernel-Identitaet & Sicherheitsebene (SELinux Permissive + Hardware-Crypto)
          sed -i 's/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-Samsung-Galaxy-A5-Ultra-Adaptive"/g' "$DEFCONFIG"
          grep -q "CONFIG_LOCALVERSION=" "$DEFCONFIG" || echo 'CONFIG_LOCALVERSION="-Samsung-Galaxy-A5-Ultra-Adaptive"' >> "$DEFCONFIG"
          echo "CONFIG_SECURITY_SELINUX_DEVELOP=y" >> "$DEFCONFIG"
          echo "CONFIG_CRYPTO_CRC32C=y" >> "$DEFCONFIG"
          echo "CONFIG_CRYPTO_LZ4=y" >> "$DEFCONFIG"

          # 2. 75Hz Super-AMOLED Overclocking & High Brightness Mode (HBM) Unlock
          find arch/arm64/boot/dts -type f -name "*.dts*" -exec sed -i 's/refresh = <60>;/refresh = <75>;/g; s/fps = <60>;/fps = <75>;/g; s/panel-refresh-rate = <60>;/panel-refresh-rate = <75>;/g' {} + 2>/dev/null || true
          find drivers/video/fbdev/exynos -type f -name "*.c" -exec sed -i 's/hbm_mode = 0/hbm_mode = 1/g' {} + 2>/dev/null || true

          # 3. CPU auf 2054 MHz (Platz 0) & 2002 MHz (Platz 1) hochziehen (sicherer Boot auf 1794 MHz)
          sed -i 's/cl0_boot_max_qos = <2002000>;/cl0_boot_max_qos = <1794000>;/g' "$DTS_FILE"
          sed -i 's/cl1_boot_max_qos = <2002000>;/cl1_boot_max_qos = <1794000>;/g' "$DTS_FILE"
          sed -i 's/0  2002000  1200000  1014000/0  2054000  1250000  1014000/g' "$DTS_FILE"
          sed -i 's/1  1872000  1200000  1014000/1  2002000  1200000  1014000/g' "$DTS_FILE"
          sed -i 's/1  1924000  1200000  1014000/1  2002000  1200000  1014000/g' "$DTS_FILE"
          if [ -f "$CPU_CAL" ]; then
            sed -i 's/if (ptr->freq_table\[i\].frequency != (unsigned int)ptr_temp_table\[i\].rate)/if (i >= 1 \&\& ptr->freq_table\[i\].frequency != (unsigned int)ptr_temp_table\[i\].rate)/g' "$CPU_CAL"
          fi

          # 4. GPU Limit-Break: 1248 MHz & 1196 MHz freischalten + sparsamer 343 MHz Leerlauf
          sed -i 's/{1138, 950000, 0, 98, 100, 1, 0, 1539000, 400000, 1482000, CPU_MAX},/{1248, 1025000, 0, 98, 100, 1, 0, 1794000, 400000, 1482000, CPU_MAX},\n\t{1196, 990000, 0, 98, 100, 1, 0, 1794000, 400000, 1482000, CPU_MAX},\n\t{1138, 950000, 0, 98, 100, 1, 0, 1794000, 400000, 1482000, CPU_MAX},/g' "$GPU_FILE"
          sed -i 's/{GPU_MAX_CLOCK, 1138}/{GPU_MAX_CLOCK, 1196}/g' "$GPU_FILE"
          sed -i 's/{GPU_MAX_CLOCK_LIMIT, 1138}/{GPU_MAX_CLOCK_LIMIT, 1248}/g' "$GPU_FILE"
          sed -i 's/{GPU_MAX_VOLTAGE, [0-9]*}/{GPU_MAX_VOLTAGE, 1100000}/g' "$GPU_FILE"

          # 5. LPDDR4 RAM-Takt (MIF) auf maximale 1794 MHz freischalten (450 MHz im Leerlauf)
          sed -i 's/freq_info = <1539000 450000 450000 1539000 450000 1539000>;/freq_info = <1539000 450000 450000 1794000 450000 1794000>;/g' "$DTS_FILE"

          # 6. Flagship Input-Booster, Touchscreen-Latenz & Fingerabdruck-Treiber beschleunigen
          find arch/arm64/boot/dts -type f -name "*.dts*" -exec sed -i 's/ibi,cpu_freq = <[^>]*>/ibi,cpu_freq = <2054000 1794000 0>/g; s/ibi,mif_freq = <[^>]*>/ibi,mif_freq = <1794000 1539000 0>/g' {} + 2>/dev/null || true
          find drivers/fingerprint -type f -name "*.c" -exec sed -i 's/msleep(20)/msleep(5)/g; s/msleep(10)/msleep(3)/g' {} + 2>/dev/null || true
          find drivers/input/touchscreen -type f -name "*.c" -exec sed -i 's/msleep(20)/msleep(5)/g; s/msleep(15)/msleep(4)/g' {} + 2>/dev/null || true

          # 7. Thermal-Throttling entfesseln (erst ab 95 Grad)
          sed -i 's/{TEMP_THROTTLING1, [0-9]*}/{TEMP_THROTTLING1, 95}/g' "$GPU_FILE"
          sed -i 's/{TEMP_THROTTLING2, [0-9]*}/{TEMP_THROTTLING2, 97}/g' "$GPU_FILE"
          sed -i 's/{TEMP_THROTTLING3, [0-9]*}/{TEMP_THROTTLING3, 99}/g' "$GPU_FILE"
          sed -i 's/{TEMP_THROTTLING4, [0-9]*}/{TEMP_THROTTLING4, 101}/g' "$GPU_FILE"

          # 8. Ladeelektronik (S2MU004) auf 2500 mA Fast-Charge & 1200 mA USB entsperren
          find drivers/battery* -type f -name "*.c" -exec sed -i 's/1650/2500/g; s/1800/2500/g; s/475/1200/g; s/500/1200/g' {} + 2>/dev/null || true

          # 9. 1000Hz Ultra-Timer, eMMC No-CRC Speicher-Turbo & Google BBR Netzwerk-Stack
          echo "CONFIG_HZ_1000=y" >> "$DEFCONFIG"
          echo "# CONFIG_HZ_250 is not set" >> "$DEFCONFIG"
          echo "# CONFIG_MMC_SPI_CRC_ON is not set" >> "$DEFCONFIG"
          echo "CONFIG_TCP_CONG_ADVANCED=y" >> "$DEFCONFIG"
          echo "CONFIG_TCP_CONG_BBR=y" >> "$DEFCONFIG"
          echo "CONFIG_DEFAULT_BBR=y" >> "$DEFCONFIG"
          echo 'CONFIG_DEFAULT_TCP_CONG="bbr"' >> "$DEFCONFIG"
          find drivers/mmc -type f -name "*.c" -exec sed -i 's/bool use_spi_crc = 1;/bool use_spi_crc = 0;/g' {} + 2>/dev/null || true

      - name: Kernel bauen (Samsung Galaxy A5 Ultra)
        run: |
          chmod +x build_rise.sh
          printf "y\n7\na5\nn\n" | ./build_rise.sh

      - name: All-In-One TWRP Flash-ZIP (Bootlogo + 4K Cam + Stereo + 3GB ZRAM + Adaptive Tune) bauen
        run: |
          set -e
          mkdir -p ultra_zip/META-INF/com/google/android
          BOOT_IMG=$(find . -maxdepth 3 -name "*boot*.img" | head -n 1)
          echo "Gefundenes Boot-Image: $BOOT_IMG"
          test -f "$BOOT_IMG"
          cp "$BOOT_IMG" ultra_zip/boot.img

          # Eigenes Full-HD Bootlogo (logo.jpg) sicher per Python erzeugen
          python3 -c '
          from PIL import Image, ImageDraw
          img = Image.new("RGB", (1080, 1920), "black")
          d = ImageDraw.Draw(img)
          d.text((430, 780), "SAMSUNG", fill="white")
          d.text((340, 860), "GALAXY A5 ULTRA", fill=(0, 168, 255))
          d.text((250, 950), "75Hz AMOLED  |  2054MHz CPU  |  1248MHz GPU", fill=(180, 180, 180))
          d.text((290, 1650), "4K UHD Pro Cam  |  Stereo Hi-Fi  |  Exynos Ultra", fill=(110, 110, 110))
          img.save("ultra_zip/logo.jpg", quality=92)
          '

          cat << 'EOF' > ultra_zip/ultra_autotune.sh
          #!/system/bin/sh
          sleep 20

          # 1. SELinux Permissive fuer volle Treiber-, 4K-Kamera- & Audio-Freiheit
          setenforce 0 2>/dev/null

          # 2. Adaptiver Flagship-Governor (344MHz im Leerlauf, blitzschnell 2054MHz unter Last)
          for cpu in /sys/devices/system/cpu/cpu[0-7]/cpufreq; do
            if [ -d "$cpu" ]; then
              echo 344000 > "$cpu/scaling_min_freq" 2>/dev/null
              echo 2054000 > "$cpu/scaling_max_freq" 2>/dev/null
            fi
          done
          for gov in /sys/devices/system/cpu/cpu*/cpufreq/interactive; do
            if [ -d "$gov" ]; then
              echo 45 > "$gov/go_hispeed_load" 2>/dev/null
              echo 2054000 > "$gov/hispeed_freq" 2>/dev/null
              echo 0 > "$gov/above_hispeed_delay" 2>/dev/null
              echo 10000 > "$gov/timer_rate" 2>/dev/null
              echo 40000 > "$gov/min_sample_time" 2>/dev/null
            fi
          done

          # 3. 3.0 GB ZRAM (LZ4) -> 6GB RAM Multitasking-Erlebnis
          swapoff /dev/block/zram0 2>/dev/null
          echo 1 > /sys/block/zram0/reset 2>/dev/null
          echo lz4 > /sys/block/zram0/comp_algorithm 2>/dev/null
          echo 3221225472 > /sys/block/zram0/disksize 2>/dev/null
          mkswap /dev/block/zram0 2>/dev/null
          swapon /dev/block/zram0 2>/dev/null
          echo 100 > /proc/sys/vm/swappiness 2>/dev/null
          echo 50 > /proc/sys/vm/vfs_cache_pressure 2>/dev/null

          # 4. eMMC Flash-Turbo & Auto-TRIM fuer dauerhaften Neuzustand-Speed
          for q in /sys/block/mmcblk*/queue; do
            echo fiops > "$q/scheduler" 2>/dev/null || echo deadline > "$q/scheduler" 2>/dev/null
            echo 2048 > "$q/read_ahead_kb" 2>/dev/null
            echo 256 > "$q/nr_requests" 2>/dev/null
            echo 0 > "$q/iostats" 2>/dev/null
          done
          fstrim -v /data 2>/dev/null
          fstrim -v /cache 2>/dev/null

          # 5. Google BBR Netzwerk, 0.5x Flagship-Animationen & App-Speed-Kompilierung
          sysctl -w net.ipv4.tcp_congestion_control=bbr 2>/dev/null
          settings put global window_animation_scale 0.5 2>/dev/null
          settings put global transition_animation_scale 0.5 2>/dev/null
          settings put global animator_duration_scale 0.5 2>/dev/null
          cmd package bg-dexopt-job 2>/dev/null &
          EOF

          cat << 'EOF' > ultra_zip/ultra_patch.sh
          #!/sbin/sh
          SYS="/system"
          [ -d "/system/system" ] && SYS="/system/system"
          PROP="$SYS/build.prop"

          if [ -f "$PROP" ]; then
            sed -i 's/ro.product.model=.*/ro.product.model=Galaxy A5 Ultra/g' "$PROP"
            sed -i 's/ro.product.system.model=.*/ro.product.system.model=Galaxy A5 Ultra/g' "$PROP"
            sed -i 's/ro.product.vendor.model=.*/ro.product.vendor.model=Galaxy A5 Ultra/g' "$PROP"
            grep -q "Samsung Galaxy A5 Ultra" "$PROP" || cat << 'PROPEOF' >> "$PROP"

